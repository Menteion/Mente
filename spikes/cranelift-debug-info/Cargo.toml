# The M0b spike on debug and unwind information through Cranelift (README.md). A workspace of
# its own, so that the compiler's dependencies stay as they are until M1's checkpoint (c).
# Norman approved these crates for the spike on 2026-11-09 (docs/design-review.md, debug-info).
[workspace]

[package]
name = "spike-cranelift-debug-info"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0 WITH LLVM-exception"
publish = false

[dependencies]
cranelift-codegen = { version = "=0.137.1", features = ["unwind"] }
cranelift-frontend = "=0.137.1"
cranelift-module = "=0.137.1"
cranelift-object = "=0.137.1"
cranelift-native = "=0.137.1"
gimli = { version = "0.33", default-features = false, features = ["write", "std", "read"] }
object = { version = "0.40", default-features = false, features = ["write", "std", "read_core", "elf", "coff"] }
