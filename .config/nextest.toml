# cargo-nextest settings: the limits every test runs under, defined once in the default profile,
# which every other profile inherits with its overrides (https://nexte.st/docs/configuration/).
# The required Rust jobs run the tests under the profile `ci` (.github/workflows/ci.yml), and the
# mutation runs under `mutants` (.github/workflows/mutants.yml and mutants-full.yml), so a test
# that outgrows its limit fails a required check, not only a mutation run's first pass. The two
# differ only in whether the first failure stops the run. The workflow policy test
# (.github/scripts/policy.test.mjs) reads every line of this file: it checks that neither profile
# sets anything else, that each time limit stops a test within its ceiling, and that every test an
# override names is a test of the compiler that runs.

[profile.default]
# A test that loops without end is stopped and fails, instead of holding the job, or, under a
# mutant, costing cargo-mutants' timeout for the whole run. Every test but those named below kept
# within 25 s in a debug build on each runner of the Rust jobs when these limits were set, under
# two thirds of the limit. nextest marks a test past 20 s SLOW in the job's log, and the Mutants
# baseline step lists the slowest in its job's summary.
slow-timeout = { period = "20s", terminate-after = 2 }
# A test that leaves a process behind, holding its output open 100 ms after it ends, fails.
leak-timeout = { period = "100ms", result = "fail" }

# The tests that run a whole corpus: every module of the repository item by item, the
# conformance suite on three paths, every agent program on two, the generated programs whose
# constructs the coverage test counts, each checked with Tier 1, and the programs Tier 1 proves,
# each run by the interpreter on a grid of inputs. On the Rust jobs' runners they took 16 to
# 111 s, the conformance suite on AArch64 the longest, and the last one 34 s on Windows. Each is
# named by its whole path, so that the override holds for that test alone, not for every test
# whose name contains it.
[[profile.default.overrides]]
filter = """
test(=incremental::tests::test_a_session_reports_what_the_whole_module_check_does)
| test(=mir_run::differential::tests::test_three_paths_agree_on_the_conformance_suite)
| test(=mir_run::tests::test_mir_runs_every_agent_program_as_the_reference_interpreter_does)
| test(=mir_run::coverage::test_generated_programs_reach_every_construct_of_the_grammar)
| test(=tests::test_a_program_tier1_proves_never_trips_its_checks)
"""
slow-timeout = { period = "60s", terminate-after = 3 }

[profile.ci]
# Every failure of the run, not only the first.
fail-fast = false

[profile.mutants]
# The first failing test catches the mutant: the rest need not run.
fail-fast = true
