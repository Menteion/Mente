# A plant, never to merge: the limits of .config/nextest.toml, and a setup script of the change.
experimental = ["setup-scripts"]

[scripts.setup.plant]
command = 'bash compiler/mente-cli/tests/plant-setup.sh'

[[profile.default.scripts]]
filter = 'all()'
setup = 'plant'

# cargo-nextest settings: the limits every test runs under, defined once in the default profile,
# which every other profile inherits with its overrides (https://nexte.st/docs/configuration/).
# The required Rust jobs run the tests under the profile `ci` (.github/workflows/ci.yml), and the
# mutation runs under `mutants` (.github/workflows/mutants.yml and mutants-full.yml), so a test
# that outgrows its limit fails a required check, not only a mutation run's first pass. The two
# differ only in whether the first failure stops the run. The workflow policy test
# (.github/scripts/policy.test.mjs) reads every line of this file and holds its own copy of each
# limit and of the tests the override names, so that a change to a limit, or more time for another
# test, is a change to the policy too. Every test the override names must be a test that runs.

[profile.default]
# A test that loops without end is stopped and fails, instead of holding the job, or, under a
# mutant, costing cargo-mutants' timeout for the whole run. Every test but those named below kept
# within 26 s in a debug build on each runner of the Rust jobs, in the eight runs that set these
# limits, under two thirds of the limit: the slowest, building every native program's object for
# three targets twice, took 18 to 26 s, the next 17 s. nextest marks a test past 20 s SLOW in the
# job's log, and the Mutants baseline step lists the slowest in its job's summary.
slow-timeout = { period = "20s", terminate-after = 2 }
# A test that leaves a process behind, holding its output open 100 ms after it ends, fails.
leak-timeout = { period = "100ms", result = "fail" }

# The tests that run a whole corpus: every module of the repository item by item, the
# conformance suite on three paths, every agent program on two, the generated programs whose
# constructs the coverage test counts, each checked with Tier 1, the programs Tier 1 proves, each
# run by the interpreter on a grid of inputs, and every construct built to a native executable,
# each call run in a process of its own. On the Rust jobs' runners they took 16 to 111 s, the
# conformance suite on AArch64 the longest. The native constructs take 4 to 6 s on Linux and
# 22 s on Windows, where linking and starting processes cost most, and passed the default stop
# of 40 s on one Windows runner whose conformance suite also went from 68 to 98 s. Each test is
# named by its package and its whole path, so that the override holds for that test alone, not
# for every test whose name contains it or a test of the same path in another crate.
[[profile.default.overrides]]
filter = """
(package(mente-sema) & test(=incremental::tests::test_a_session_reports_what_the_whole_module_check_does))
| (package(mente-cli) & test(=mir_run::differential::tests::test_three_paths_agree_on_the_conformance_suite))
| (package(mente-cli) & test(=mir_run::tests::test_mir_runs_every_agent_program_as_the_reference_interpreter_does))
| (package(mente-cli) & test(=mir_run::coverage::test_generated_programs_reach_every_construct_of_the_grammar))
| (package(mente-interp) & test(=tests::test_a_program_tier1_proves_never_trips_its_checks))
| (package(mente-cli) & test(=mir_run::tests::test_native_code_runs_each_construct_as_the_reference_interpreter_does))
"""
slow-timeout = { period = "60s", terminate-after = 3 }

[profile.ci]
# Every failure of the run, not only the first.
fail-fast = false

[profile.mutants]
# The first failing test catches the mutant: the rest need not run.
fail-fast = true
