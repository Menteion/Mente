[package]
name = "mente-codegen"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Mente native code generation through Cranelift: object files with debug and unwind information"

# Norman approved these crates for mente-codegen on 2026-11-10: the set and the versions the M0b
# spike used (spikes/cranelift-debug-info). Every target this crate's tests write for is compiled
# in (`x86`, `arm64`), so that each host checks all of them.
[dependencies]
mente-mir = { path = "../mente-mir" }
mente-sema = { path = "../mente-sema" }
mente-syntax = { path = "../mente-syntax" }
cranelift-codegen = { version = "=0.137.2", features = ["unwind", "x86", "arm64"] }
cranelift-frontend = "=0.137.2"
cranelift-module = "=0.137.2"
cranelift-object = "=0.137.2"
cranelift-native = "=0.137.2"
# gimli and object come only through cranelift, by its re-exports `cranelift_codegen::gimli` and
# `cranelift_object::object`, and are no dependency of this crate: cranelift-codegen and
# cranelift-object use them in their own signatures, so a version of either apart from cranelift's
# is a second crate, and a type of one is no type of the other (E0308; Dependabot's pull request
# 164 moved them alone and broke every Rust job). cranelift turns on every feature the writers use:
# gimli's `read`, `write` and `std`, and object's `read_core`, `elf`, `write` and `std`, where
# `write` brings `coff` and `pe` for Windows. test_gimli_and_object_are_cranelifts in
# compiler/mente-cli holds the lock to one version of each, cranelift's.

[lints]
workspace = true
