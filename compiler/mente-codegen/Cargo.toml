[package]
name = "mente-codegen"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Mente native code generation through Cranelift: object files with debug and unwind information"

# Norman approved these crates for mente-codegen on 2026-11-10: the set and the versions the M0b
# spike used (spikes/cranelift-debug-info). Every target this crate's tests write for is compiled
# in (`x86`, `arm64`), so that each host checks all of them.
[dependencies]
mente-mir = { path = "../mente-mir" }
mente-sema = { path = "../mente-sema" }
mente-syntax = { path = "../mente-syntax" }
cranelift-codegen = { version = "=0.137.1", features = ["unwind", "x86", "arm64"] }
cranelift-frontend = "=0.137.1"
cranelift-module = "=0.137.1"
cranelift-object = "=0.137.1"
cranelift-native = "=0.137.1"
# gimli and object come only through cranelift's re-exports, `cranelift_codegen::gimli` and
# `cranelift_object::object`, since cranelift-codegen and cranelift-object use them in their own
# signatures: a version of either apart from cranelift's is a second crate, and a type of one is no
# type of the other (E0308; Dependabot's pull request 164 moved them alone and broke every Rust
# job). cranelift turns on gimli's `read`, `write` and `std` and object's `read_core`, `elf`,
# `write` and `std`; object's `coff`, for Windows, is turned on here, under a name no code can
# import, at exactly the version cranelift-object takes. test_gimli_and_object_are_cranelifts in
# compiler/mente-cli holds them to one version each, cranelift's.
object-features = { package = "object", version = "=0.40.0", default-features = false, features = ["coff"] }

[lints]
workspace = true
