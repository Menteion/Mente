# cargo-mutants settings, read by .github/workflows/mutants.yml. Mutation runs happen on
# GitHub's runners, not on a developer's machine (ROADMAP.md, M0a).

# A parser function is often tested from a crate downstream of it, so every mutant runs
# against the whole workspace's tests.
test_workspace = true

# Through nextest, whose profile `mutants` (.config/nextest.toml) stops a test that runs too
# long, so that a mutant that loops without end fails a test within 30 seconds.
test_tool = "nextest"


# Spikes are experiments outside the compiler crates: tested, never cited as evidence, and not
# mutation-tested (docs/design-brief.md, "Spikes before the milestone that needs them").
exclude_globs = ["spikes/**"]

# The fuzzer (compiler/mente-cli/src/fuzz.rs) is mutation-tested except for two groups of its
# functions, each named exactly below; its oracle (failure keys, the minimizer, the worker's
# protocol) is not excluded and is tested.
exclude_re = [
  # The input generator's random choices: which mutation, where, how deep, which inputs join
  # the corpus. Any variant still yields inputs, so no test that does not restate the code can
  # tell a mutant from the original.
  '^compiler/mente-cli/src/fuzz\.rs(:\d+:\d+)?: .* in (mutate|apply|boundary|replace|token_spans|bytes|non_ascii|spelling|tokens|edge_literal|literals|lines|items|splice|nest|deep_function|nesting|edit_text|joins_corpus|Generator::next_case|Generator::keep)$',
  '^compiler/mente-cli/src/fuzz\.rs(:\d+:\d+)?: replace (mutate|apply|boundary|replace|token_spans|bytes|non_ascii|spelling|tokens|edge_literal|literals|lines|items|splice|nest|deep_function|nesting|edit_text|joins_corpus|Generator::next_case|Generator::keep)( -> .+)? with .+$',
  # The phase driver's calls whose work shows only when the compiler fails: rendering the
  # diagnostics, the incremental comparison, the two interpreters' runs and the report of what
  # they find. On a correct compiler a phase's work is visible only when it crashes, so no
  # test can tell a mutant from the original.
  '^compiler/mente-cli/src/fuzz\.rs(:\d+:\d+)?: .* in (render|incremental|interpret|run_mir|last_panic|Run(<.+>)?::report)$',
  '^compiler/mente-cli/src/fuzz\.rs(:\d+:\d+)?: replace (render|incremental|interpret|run_mir|last_panic|Run(<.+>)?::report)( -> .+)? with .+$',
  # Stopping a worker when the fuzzer lets go of it. An idle worker ends anyway once its
  # standard input closes; this matters only for a worker still busy when a job panics in the
  # middle of a case, which no test can arrange without a race.
  '^compiler/mente-cli/src/fuzz\.rs(:\d+:\d+)?: replace <impl Drop for Worker>::drop with \(\)$',
]
