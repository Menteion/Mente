# Dependabot version updates. Security updates are switched on in the repository settings.
#
# Cargo, npm (the pinned documentation tools) and the SHA-pinned actions of
# .github/workflows/.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Taipei
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Taipei
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Taipei
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
