# Dependabot version updates. Security updates are switched on in the repository settings.
#
# Cargo, npm (the pinned documentation tools) and the SHA-pinned actions of
# .github/workflows/.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Taipei
    open-pull-requests-limit: 5
    groups:
      # cranelift-codegen and cranelift-object use gimli and object in their own signatures, so
      # these move as one pull request, never apart: pull request 164 moved gimli and object alone
      # and every Rust job failed. A dependency joins the first group that matches it, so this one
      # stands before the catch-all; test_gimli_and_object_are_cranelifts in
      # compiler/mente-cli/tests/gates.rs refuses a lock that splits them.
      cranelift:
        patterns:
          - "cranelift-*"
          - "gimli"
          - "object"
      cargo:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Taipei
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Taipei
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
