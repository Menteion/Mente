# Dependabot version updates. Security updates are switched on in the repository settings.
#
# Cargo and npm (the pinned documentation tools) are listed; github-actions joins when
# .github/workflows/ exists, since Dependabot reports an error for an ecosystem whose
# manifest is missing.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Taipei
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Taipei
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns:
          - "*"
