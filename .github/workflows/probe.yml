# The syntax probe of M1's checkpoint (a) (docs/design-review.md, syntax-probe): agents write
# the public M1 tasks from the draft language card, and mn check reads every program. Run by
# hand, within the budget Norman set; the programs and the record are kept as an artifact, and
# the findings go to benchmark/probe/.
#
# Two jobs, so that agent-written code never runs where a secret is: the first holds the API key
# and only writes the programs, building no compiler; the second holds no secret, and runs
# `mn check` on them (benchmark/harness/probe.ts --check).
# Every action is pinned to a full commit SHA; Dependabot proposes updates.
name: Syntax probe

on:
  workflow_dispatch:
    inputs:
      runs:
        description: Runs per task
        default: "3"
      budget:
        description: Budget in US dollars
        default: "5"

permissions:
  contents: read

concurrency:
  group: syntax-probe
  cancel-in-progress: false

jobs:
  write:
    name: Probe, the agents write
    runs-on: ubuntu-24.04
    # The API key and the held-out token live only in this environment, whose deployment branches
    # are main alone: no other ref, and no pull request, runs with them
    # (docs/design-review.md, trust-from-structure).
    environment: benchmark
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Take root from the runner's user, but for the sandbox
        # From here to the job's end sudo runs nothing for the runner's user but the sandbox's
        # root-owned half, no core dump is written, no process traces another, and no container
        # daemon listens, so that no process of that user reads the key out of another's memory
        # (benchmark/harness/lock-sudo.sh; docs/design-review.md, untrusted-test-isolation).
        run: bash benchmark/harness/lock-sudo.sh
      - name: The broker, the one process that holds the API key
        # The key reaches the broker on its standard input and in no environment. Under Node's
        # permission model and the flags of benchmark/harness/permission.json it can start no process,
        # worker, addon or WASI, read only its own file and its limits, and write none; it sends on only
        # the shape of request the harness makes, within the limits of broker-limits.json; and its
        # socket is the runner's user's alone, out of the sandbox's reach. The step ends once it
        # listens, and the shell that held the key with it, a privileged bash that reads no BASH_ENV,
        # ENV, SHELLOPTS, BASHOPTS or exported function and names every command by its path
        # (benchmark/harness/start-broker.sh;
        # docs/design-review.md, untrusted-test-isolation).
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUDGET: ${{ inputs.budget }}
        shell: /usr/bin/env -u BASH_ENV -u ENV -u SHELLOPTS -u BASHOPTS /usr/bin/bash --noprofile --norc -p -eo pipefail {0}
        run: /usr/bin/bash -p benchmark/harness/start-broker.sh
      - name: The agents write the programs
        env:
          RUNS: ${{ inputs.runs }}
          BUDGET: ${{ inputs.budget }}
        run: node --disallow-code-generation-from-strings benchmark/harness/probe.ts --runs "$RUNS" --budget "$BUDGET" --out probe-out --broker "$RUNNER_TEMP/broker/socket"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: syntax-probe-programs
          path: probe-out
      - name: Stop the broker
        # Whatever came before; its log holds no key, which the broker takes out of every byte it
        # writes. Then root must still be out of the runner's user's reach, as the lock left it.
        if: always()
        run: |
          bash benchmark/harness/stop-broker.sh
          bash benchmark/harness/lock-sudo.sh --check

  check:
    name: Probe, mn checks
    needs: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No secret of the benchmark outside its environment
        # This job names no environment, so a secret it sees is a repository's or an
        # organization's: both must live in the environment benchmark alone, for main alone.
        env:
          KEY_LEAKED: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HELD_OUT_LEAKED: ${{ secrets.MENTE_BENCH_HELDOUT_TOKEN != '' }}
        run: if [ "$KEY_LEAKED" != false ] || [ "$HELD_OUT_LEAKED" != false ]; then echo "::error::a secret of the benchmark is set outside the environment benchmark"; exit 1; fi
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup toolchain install
      - name: Build mn
        run: cargo build --locked --release --bin mn
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: syntax-probe-programs
          # Outside the checkout, as every artifact a workflow downloads.
          path: ${{ runner.temp }}/probe-out
      - name: mn check reads every program
        run: node benchmark/harness/probe.ts --check "$RUNNER_TEMP/probe-out/" --mn target/release/mn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: syntax-probe
          path: ${{ runner.temp }}/probe-out
