# The syntax probe of M1's checkpoint (a) (docs/design-review.md, syntax-probe): agents write
# the public M1 tasks from the draft language card, and mn check reads every program. Run by
# hand, within the budget Norman set; the programs and the record are kept as an artifact, and
# the findings go to benchmark/probe/.
#
# Two jobs, so that agent-written code never runs where a secret is: the first holds the API key
# and only writes the programs, building no compiler; the second holds no secret, and runs
# `mn check` on them (benchmark/harness/probe.ts --check).
# Every action is pinned to a full commit SHA; Dependabot proposes updates.
name: Syntax probe

on:
  workflow_dispatch:
    inputs:
      runs:
        description: Runs per task
        default: "3"
      budget:
        description: Budget in US dollars
        default: "5"

permissions:
  contents: read

concurrency:
  group: syntax-probe
  cancel-in-progress: false

jobs:
  write:
    name: Probe, the agents write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: The agents write the programs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUNS: ${{ inputs.runs }}
          BUDGET: ${{ inputs.budget }}
        run: node benchmark/harness/probe.ts --runs "$RUNS" --budget "$BUDGET" --out probe-out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: syntax-probe-programs
          path: probe-out

  check:
    name: Probe, mn checks
    needs: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup toolchain install
      - name: Build mn
        run: cargo build --locked --release --bin mn
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: syntax-probe-programs
          path: probe-out
      - name: mn check reads every program
        run: node benchmark/harness/probe.ts --check probe-out --mn target/release/mn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: syntax-probe
          path: probe-out
