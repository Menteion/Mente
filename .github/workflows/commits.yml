# Commit and pull request text, before it reaches `main`'s history (.github/scripts/commits.mjs):
# no "WIP", "fixup!", "squash!" or "amend!" subject, and English in every commit message and in
# the pull request's title and body (CLAUDE.md, invariant 3). It runs again when the title or the
# body is edited. A required check of `main`.
# Every action is pinned to a full commit SHA; Dependabot proposes updates.
name: Commits

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:

permissions:
  contents: read

concurrency:
  group: commits-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    name: Commits
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the subjects and the text
        env:
          # The pull request's text reaches the script only through the environment.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node .github/scripts/commits.mjs
