# The SMT cross-check of Tier 1 (docs/design-brief.md, "The quality system"): every obligation
# Tier 1 discharges, in every program that Tier 1 runs on, is written by `mn smt` as an SMT-LIB 2
# query in QF_LIA built from the state Tier 1 decided it on (compiler/mente-sema/src/tier1/smt.rs),
# and Z3 must answer `unsat` to each. Any other answer, `sat`, `unknown`, a timeout or an error,
# fails the job and prints the query with its source position: a satisfiable query means Tier 1
# discharged an obligation that does not follow from its own facts, a soundness bug.
#
# What it proves: each obligation follows from the facts Tier 1 held where it decided it. What it
# does not: that those facts were derived soundly from the program, which soundness by execution
# checks. An obligation discharged where no path reaches it is listed, not queried.
#
# The independent cross-check closes that gap: `mn smt --independent` encodes each check Tier 1
# erases from the program itself (compiler/mente-smt, which depends on the syntax tree alone), and
# `mn smt --confirm` runs each model Z3 finds on the reference interpreter. `mn smt --compare` holds
# the run to its base's, check by check over the programs both trees hold unchanged.
#
# Z3 is installed here from its release, pinned and checksummed; it is never a build dependency.
# Solving runs on GitHub Actions only, never on a laptop.
#
# A required check of `main`: it runs on every pull request, in the merge queue and on `main`, and
# its first step after the checkout ends the job at once when no path .github/instrument-paths.txt
# lists for it changed. The export builds `mn`, so every crate it is built from is watched.
name: SMT cross-check

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: smt-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  Z3_VERSION: "5.3.3"
  Z3_ASSET: z3-5.3.3-x64-glibc-2.39
  # GitHub's digest of the release asset.
  Z3_SHA256: d56f60b06f432f33de5810f7f1a384a339131f361e2d54d08ea83eea14326880

jobs:
  z3:
    name: Tier 1 against Z3
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Whether this change touches what the instrument watches
        id: watch
        run: node .github/scripts/watch.mjs smt.yml
      - name: The toolchain rust-toolchain.toml pins, once nothing of the change can run where cargo builds
        if: steps.watch.outputs.run != 'false'
        # Before rustup or cargo reads anything of the workspace: rust-toolchain.toml names a release
        # alone and no cargo configuration file is there; then cargo reads the manifests and the
        # lock, and a package with code that runs at build time, or a crate not approved, fails the
        # job before anything is built (.github/scripts/build-time-code.mjs).
        run: |
          node .github/scripts/build-time-code.mjs --before-toolchain
          rustup toolchain install
          node .github/scripts/build-time-code.mjs
      - name: Overflow checks in this job's release build
        if: steps.watch.outputs.run != 'false'
        run: bash .github/scripts/overflow-proof.sh
      - name: Install Z3 ${{ env.Z3_VERSION }}, checksummed
        if: steps.watch.outputs.run != 'false'
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/z3.zip"
          curl -fsSL --retry 3 -o "$zip" \
            "https://github.com/Z3Prover/z3/releases/download/z3-${Z3_VERSION}/${Z3_ASSET}.zip"
          echo "${Z3_SHA256}  $zip" | sha256sum -c -
          unzip -q "$zip" -d "$RUNNER_TEMP/z3"
          bin=$(dirname "$(find "$RUNNER_TEMP/z3" -type f -name z3 -path '*/bin/*' | head -n 1)")
          chmod +x "$bin/z3"
          echo "$bin" >> "$GITHUB_PATH"
          version=$("$bin/z3" --version)
          echo "$version"
          case "$version" in
            *"Z3 version ${Z3_VERSION} "*) ;;
            *) echo "::error::expected Z3 ${Z3_VERSION}"; exit 1 ;;
          esac
      - name: Write the construct programs of mir_run.rs, and build mn
        if: steps.watch.outputs.run != 'false'
        run: |
          MENTE_SMT_CONSTRUCTS="$RUNNER_TEMP/constructs" \
            timeout 15m cargo test --release --locked -p mente-cli --test smt -- --ignored --exact write_construct_programs --nocapture
          cargo build --release --locked --bin mn
      - name: Export a query for each obligation Tier 1 discharges
        if: steps.watch.outputs.run != 'false'
        run: |
          set -euo pipefail
          # The examples, the conformance programs that must pass, the agent programs, the
          # construct programs and the tight-loop kernels: every module Tier 1 runs on.
          mapfile -t pass < <(for f in conformance/*/*.mn; do
            if [ "$(head -n 1 "$f")" = "// expect: pass" ]; then echo "$f"; fi
          done)
          mapfile -t agents < <(find benchmark/probe benchmark/prelim -name '*.mn' | sort)
          start=$(date +%s%N)
          ./target/release/mn smt examples "${pass[@]}" "${agents[@]}" "$RUNNER_TEMP/constructs" perf/kernels \
            --out "$RUNNER_TEMP/smt" | tee "$RUNNER_TEMP/export.txt"
          ms=$(( ($(date +%s%N) - start) / 1000000 ))
          printf 'EXPORT_SECONDS=%d.%03d\n' $((ms / 1000)) $((ms % 1000)) >> "$GITHUB_ENV"
      - name: Ask Z3 for each query
        if: steps.watch.outputs.run != 'false'
        run: |
          set -euo pipefail
          find "$RUNNER_TEMP/smt" -name '*.smt2' | sort > "$RUNNER_TEMP/queries.txt"
          total=$(wc -l < "$RUNNER_TEMP/queries.txt")
          # A floor, so that an export that silently lost its programs fails.
          if [ "$total" -lt 5000 ]; then
            echo "::error::only $total queries were written; the export lost programs"
            exit 1
          fi
          # One solver process a query, as many at once as the runner has cores; one line each:
          # Z3's whole answer on one line, a tab, then the query's path.
          check() {
            answer=$(z3 -T:60 "$1" 2>&1 | tr '\n' ' ' | sed 's/ *$//')
            printf '%s\t%s\n' "$answer" "$1"
          }
          export -f check
          start=$(date +%s%N)
          # The $1 is the inner shell's argument, the query's path, so it stays in single quotes.
          # shellcheck disable=SC2016
          xargs -a "$RUNNER_TEMP/queries.txt" -d '\n' -P "$(nproc)" -n 1 bash -c 'check "$1"' _ \
            > "$RUNNER_TEMP/answers.txt"
          ms=$(( ($(date +%s%N) - start) / 1000000 ))
          seconds=$(printf '%d.%03d' $((ms / 1000)) $((ms % 1000)))
          answered=$(wc -l < "$RUNNER_TEMP/answers.txt")
          awk -F '\t' '$1 != "unsat"' "$RUNNER_TEMP/answers.txt" > "$RUNNER_TEMP/failures.txt"
          failed=$(wc -l < "$RUNNER_TEMP/failures.txt")
          unreached=$(grep -c '^unreached: ' "$RUNNER_TEMP/export.txt" || true)
          {
            echo "### SMT cross-check"
            echo
            echo "| | |"
            echo "| :--- | ---: |"
            echo "| Queries written | $total |"
            echo "| Answered \`unsat\` | $((answered - failed)) |"
            echo "| Any other answer | $failed |"
            echo "| Discharged where no path reaches, not queried | $unreached |"
            echo "| Export, seconds | $EXPORT_SECONDS |"
            echo "| Z3 ${Z3_VERSION} on every query, seconds, $(nproc) at once | $seconds |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$answered" -ne "$total" ]; then
            echo "::error::Z3 answered $answered of $total queries"
            exit 1
          fi
          if [ "$failed" -gt 0 ]; then
            echo "::error::Z3 did not answer unsat to $failed queries: Tier 1 discharged an obligation that does not follow from its facts, or the export is wrong"
            head -n 20 "$RUNNER_TEMP/failures.txt" | while IFS=$'\t' read -r answer path; do
              echo "::group::$answer: $(head -n 1 "$path" | sed 's/^; source: //')"
              echo "Z3 answered: $answer"
              cat "$path"
              echo "::endgroup::"
            done
            exit 1
          fi
      - name: Export the independent queries, each check Tier 1 erases encoded from the program
        if: steps.watch.outputs.run != 'false'
        # compiler/mente-smt encodes each check from the syntax tree and the checker's types alone,
        # never from Tier 1's facts, unrolling each loop and each recursion up to 3 times
        # (docs/design-review.md, smt-independent-encoding). The known soundness bugs of
        # compiler/mente-cli/tests/smt-known are exported with the rest, and must be confirmed.
        # The export fails on an obligation of Tier 1 with no site, and writes what it made of each
        # check Tier 1 erased, for the comparison with the base.
        run: |
          set -euo pipefail
          mapfile -t pass < <(for f in conformance/*/*.mn; do
            if [ "$(head -n 1 "$f")" = "// expect: pass" ]; then echo "$f"; fi
          done)
          mapfile -t agents < <(find benchmark/probe benchmark/prelim -name '*.mn' | sort)
          start=$(date +%s%N)
          ./target/release/mn smt --independent examples "${pass[@]}" "${agents[@]}" "$RUNNER_TEMP/constructs" perf/kernels \
            compiler/mente-cli/tests/smt-known --out "$RUNNER_TEMP/independent" --keys "$RUNNER_TEMP/independent-keys.txt" | tee "$RUNNER_TEMP/independent-export.txt"
          ms=$(( ($(date +%s%N) - start) / 1000000 ))
          printf 'INDEPENDENT_EXPORT_SECONDS=%d.%03d\n' $((ms / 1000)) $((ms % 1000)) >> "$GITHUB_ENV"
      - name: Ask Z3 for each independent query, and run each model on the reference interpreter
        if: steps.watch.outputs.run != 'false'
        # `unsat`: no input fails the check within the bounds. `sat`: Z3's model is the inputs of a
        # run that fails a check Tier 1 proved; `mn smt --confirm` runs it on the reference
        # interpreter, and a trap there confirms a soundness bug of Tier 1, while any other outcome
        # is a defect of the encoding. Both fail the job, unless the bug is a known one. The queries
        # are integer arithmetic, linear and nonlinear (a product of two variables, a division or a
        # remainder by one), over arrays, with conversions to bit-vectors for the bit operations; no
        # logic is set, and Z3 chooses. A timeout or `unknown`, which the nonlinear and bit-vector
        # queries can give, decides nothing here, and the comparison with the base counts them; a
        # solver's error and a query with no answer fail the job. The answers are counted by fragment.
        run: |
          set -euo pipefail
          find "$RUNNER_TEMP/independent" -name '*.smt2' | sort > "$RUNNER_TEMP/independent-queries.txt"
          total=$(wc -l < "$RUNNER_TEMP/independent-queries.txt")
          # The function is called by name through xargs and bash -c, which shellcheck does not see.
          # shellcheck disable=SC2329
          check() {
            answer=$(z3 -T:10 "$1" 2>&1 | tr '\n' ' ' | sed 's/ *$//')
            printf '%s\t%s\n' "$answer" "$1"
          }
          export -f check
          start=$(date +%s%N)
          # shellcheck disable=SC2016
          xargs -a "$RUNNER_TEMP/independent-queries.txt" -d '\n' -P "$(nproc)" -n 1 bash -c 'check "$1"' _ \
            > "$RUNNER_TEMP/independent-answers.txt"
          ms=$(( ($(date +%s%N) - start) / 1000000 ))
          seconds=$(printf '%d.%03d' $((ms / 1000)) $((ms % 1000)))
          status=0
          ./target/release/mn smt --confirm "$RUNNER_TEMP/independent-answers.txt" --queries "$RUNNER_TEMP/independent-queries.txt" \
            --expect compiler/mente-cli/tests/smt-known/loop-candidate-facts.mn > "$RUNNER_TEMP/confirm.txt" || status=$?
          cat "$RUNNER_TEMP/confirm.txt"
          count() { grep -c "^$1: " "$RUNNER_TEMP/confirm.txt" || true; }
          {
            echo "### Independent SMT cross-check"
            echo
            echo "| | |"
            echo "| :--- | ---: |"
            echo "| Queries written | $total |"
            echo "| Answered \`unsat\` | $(cut -f1 "$RUNNER_TEMP/independent-answers.txt" | grep -c '^unsat' || true) |"
            echo "| Undecided: a timeout or \`unknown\` | $(count undecided) |"
            echo "| Errors: a solver's error, or a query answered not once | $(count error) |"
            echo "| Soundness bugs of Tier 1, confirmed on the interpreter | $(count confirmed) |"
            echo "| Known soundness bugs, confirmed | $(count known) |"
            echo "| Models the interpreter does not confirm: defects of the encoding | $(count unconfirmed) |"
            echo "| Known bugs not confirmed | $(count missing) |"
            echo "| Places of a construct the encoding lacks | $(grep -c '^unencoded: ' "$RUNNER_TEMP/independent-export.txt" || true) |"
            echo "| Export, seconds | $INDEPENDENT_EXPORT_SECONDS |"
            echo "| Z3 ${Z3_VERSION} on every query, seconds, $(nproc) at once | $seconds |"
            echo
            grep -E '^(Wrote |fragment: )' "$RUNNER_TEMP/independent-export.txt" "$RUNNER_TEMP/confirm.txt" \
              | sed -E 's/^[^:]*:/- /' || true
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::error::the independent cross-check found a soundness bug of Tier 1, a defect of the encoding, a known bug no longer confirmed or a solver's error; the lines above name each"
          fi
          exit "$status"
      - name: Hold the independent cross-check to its base's, over the programs both trees hold unchanged
        if: steps.watch.outputs.run != 'false'
        # The base is a commit the checkout already holds, all history being fetched: a pull
        # request's merge commit's first parent, the commit it was merged onto; a merge group's base
        # commit; the commit before a push to main. Its compiler, built apart in a target directory
        # of its own, exports the same corpus from its own tree, with the construct programs this
        # change wrote, and Z3 answers each of its queries whose text is not this change's; the rest
        # take this change's answers. Each export names every check Tier 1 erases, with a site or
        # without one. `mn smt --compare` then holds this change to the base check by check, over
        # the programs both trees hold unchanged (one text, whatever its path), where only the
        # encoder or the checker can have changed anything: a check verified less (a query now
        # unreachable, cut off or without a site; an unreachable check now cut off or without one;
        # a check Tier 1 erases here alone that the encoding cuts off or has no site for) fails the
        # job, unless an `Smt-Drop:` trailer of a commit between the base and this change names it
        # and says why. So do such a program either export did not read or this change no longer
        # checks, a trailer no check needs, undecided answers past the base's by more than 5, and
        # more than one undecided answer in 200 of this change's queries. Checks verified more,
        # checks erased by Tier 1 in one run alone that are still verified, and programs added,
        # changed, renamed or deleted are listed. A base whose workspace lacks the encoding has no
        # export, and every program is new to the comparison.
        env:
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            pull_request) base="HEAD^1" ;;
            merge_group) base="$GROUP_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
            *) echo "::error::a $GITHUB_EVENT_NAME event names no base"; exit 1 ;;
          esac
          if [ -z "$base" ]; then echo "::error::the $GITHUB_EVENT_NAME event names no base"; exit 1; fi
          git worktree add ../base "$base"
          # The waivers of the commits between the base and this change, which expire with them.
          git log --format='%(trailers:key=Smt-Drop,valueonly,unfold)' "$base..HEAD" > "$RUNNER_TEMP/waivers.txt"
          for f in base-keys base-answers base-queries base-ask base-export; do : > "$RUNNER_TEMP/$f.txt"; done
          start=$(date +%s%N)
          if ./target/release/mn smt --encodes ../base; then
            (cd ../base && rustup toolchain install && CARGO_TARGET_DIR="$RUNNER_TEMP/target-base" cargo build --release --locked --bin mn)
            built=$(date +%s%N)
            mapfile -t pass < <(cd ../base && for f in conformance/*/*.mn; do
              if [ "$(head -n 1 "$f")" = "// expect: pass" ]; then echo "$f"; fi
            done)
            mapfile -t agents < <(cd ../base && find benchmark/probe benchmark/prelim -name '*.mn' | sort)
            # An obligation of the base's with no site is the base's to fix: its export still
            # writes its keys, and exits 1. Only a file it cannot read or write fails here.
            base_status=0
            (cd ../base && "$RUNNER_TEMP/target-base/release/mn" smt --independent examples "${pass[@]}" "${agents[@]}" "$RUNNER_TEMP/constructs" perf/kernels \
              compiler/mente-cli/tests/smt-known --out "$RUNNER_TEMP/base-independent" --keys "$RUNNER_TEMP/base-keys.txt") \
              > "$RUNNER_TEMP/base-export.txt" || base_status=$?
            if [ "$base_status" -gt 1 ]; then
              cat "$RUNNER_TEMP/base-export.txt"
              echo "::error::the base's export could not read or write a file"
              exit 1
            fi
            # A query whose text is this change's takes this change's answer; Z3 is asked the rest.
            find "$RUNNER_TEMP/base-independent" -name '*.smt2' | sort > "$RUNNER_TEMP/base-queries.txt"
            declare -A answer_of
            while IFS=$'\t' read -r answer path; do answer_of["$path"]=$answer; done < "$RUNNER_TEMP/independent-answers.txt"
            while IFS= read -r q; do
              mine="$RUNNER_TEMP/independent/${q#"$RUNNER_TEMP/base-independent/"}"
              if [ -n "${answer_of[$mine]+set}" ] && cmp -s "$q" "$mine"; then
                printf '%s\t%s\n' "${answer_of[$mine]}" "$q" >> "$RUNNER_TEMP/base-answers.txt"
              else
                echo "$q" >> "$RUNNER_TEMP/base-ask.txt"
              fi
            done < "$RUNNER_TEMP/base-queries.txt"
            # The function is called by name through xargs and bash -c, which shellcheck does not see.
            # shellcheck disable=SC2329
            check() {
              answer=$(z3 -T:10 "$1" 2>&1 | tr '\n' ' ' | sed 's/ *$//')
              printf '%s\t%s\n' "$answer" "$1"
            }
            export -f check
            # shellcheck disable=SC2016
            xargs -a "$RUNNER_TEMP/base-ask.txt" -d '\n' -P "$(nproc)" -n 1 --no-run-if-empty bash -c 'check "$1"' _ \
              >> "$RUNNER_TEMP/base-answers.txt"
          else
            built=$start
          fi
          now=$(date +%s%N)
          seconds() { printf '%d.%03d' $(($1 / 1000000000)) $(($1 / 1000000 % 1000)); }
          status=0
          ./target/release/mn smt --compare --base-tree ../base --base "$RUNNER_TEMP/base-keys.txt" "$RUNNER_TEMP/base-answers.txt" \
            --head "$RUNNER_TEMP/independent-keys.txt" "$RUNNER_TEMP/independent-answers.txt" --waivers "$RUNNER_TEMP/waivers.txt" > "$RUNNER_TEMP/compare.txt" || status=$?
          cat "$RUNNER_TEMP/compare.txt"
          count() { grep -c "^$1: " "$RUNNER_TEMP/compare.txt" || true; }
          {
            echo "### The independent cross-check against its base"
            echo
            echo "| | |"
            echo "| :--- | ---: |"
            echo "| Checks of unchanged programs verified less than on the base | $(count dropped) |"
            echo "| Of them, let through by an \`Smt-Drop:\` trailer | $(count waived) |"
            echo "| Trailers no check needs, or that are no waiver | $(count unused) |"
            echo "| Unchanged programs an export did not read | $(count lost) |"
            echo "| Unchanged programs this change no longer checks | $(count unchecked) |"
            echo "| Checks of unchanged programs verified more, or erased by Tier 1 in one run alone | $(count moved) |"
            echo "| Programs added, changed, renamed or deleted | $(count program) |"
            echo "| Base queries Z3 was asked, of those written | $(wc -l < "$RUNNER_TEMP/base-ask.txt") of $(wc -l < "$RUNNER_TEMP/base-queries.txt") |"
            echo "| The base's build, seconds | $(seconds $((built - start))) |"
            echo "| The base's export and Z3 on its queries, seconds | $(seconds $((now - built))) |"
            echo
            grep -E '^(dropped: |waived: |unused: |lost: |unchecked: |Of the programs |The base at )' "$RUNNER_TEMP/compare.txt" | head -n 60 | sed 's/^/- /' || true
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::error::this change verifies less than its base on programs both trees hold unchanged with no waiver naming it, a waiver is unused, an export did not read such a program or this change no longer checks one, or the undecided answers rose past their caps; the lines above name each"
          fi
          exit "$status"
      - name: Keep the queries of a failed run
        if: failure() && steps.watch.outputs.run != 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smt-queries
          path: |
            ${{ runner.temp }}/smt
            ${{ runner.temp }}/answers.txt
            ${{ runner.temp }}/export.txt
            ${{ runner.temp }}/independent
            ${{ runner.temp }}/independent-answers.txt
            ${{ runner.temp }}/independent-export.txt
            ${{ runner.temp }}/confirm.txt
            ${{ runner.temp }}/independent-keys.txt
            ${{ runner.temp }}/base-keys.txt
            ${{ runner.temp }}/base-answers.txt
            ${{ runner.temp }}/base-export.txt
            ${{ runner.temp }}/compare.txt
            ${{ runner.temp }}/waivers.txt
          if-no-files-found: ignore
          retention-days: 14
