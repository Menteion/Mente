# The measured runs of the agent benchmark (benchmark/README.md, "Method"; ROADMAP.md, "Agent
# benchmark"): every task of the milestone in Mente, Rust and Odin, with each model named, 5 runs
# each, within the budget Norman sets. Run by hand only.
#
# The held-out set is read only when the repository has the secret MENTE_BENCH_HELDOUT_TOKEN, a
# fine-grained token that can read the contents of Menteion/mente-bench-heldout and nothing else.
# Without it the run takes the public tasks alone. The held-out set is checked out at the commit
# benchmark/corpus.lock names and checked against the lock, its runs' prompts and programs never
# leave the runner, the log names a held-out task only by its place in the set, and the results
# give the held-out set only as totals. The artifact holds the public runs and results.json.
name: Agent benchmark

on:
  workflow_dispatch:
    inputs:
      budget:
        description: Budget in US dollars
        required: true
        type: string
      models:
        description: Models, separated by commas; one without listed prices as id@input/output/cache-read, in dollars per million tokens
        type: string
        default: claude-sonnet-5-5,claude-haiku-5-5
      languages:
        description: Languages, separated by commas
        type: string
        default: mente,rust,odin
      milestone:
        description: The milestone whose tasks run
        type: string
        default: M1
      runs:
        description: Runs per task, language and model
        type: string
        default: "5"
      tasks:
        description: Public tasks, all or ids separated by commas
        type: string
        default: all

permissions:
  contents: read

concurrency:
  group: agent-benchmark
  cancel-in-progress: false

jobs:
  build:
    # mn, built where no secret is: the build-time check first, as in every required job, so
    # that nothing of the branch runs where cargo builds; the job below, which holds the key, takes
    # the binary and builds nothing.
    name: Agent benchmark, mn
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The toolchain rust-toolchain.toml pins, once nothing of the change can run where cargo builds
        # The step every required job but Commits, and every job that builds mn for one that holds
        # a secret, runs first, under one rule of the policy (TOOLCHAIN_STEP,
        # .github/scripts/build-time-code.mjs).
        run: |
          node .github/scripts/build-time-code.mjs --before-toolchain
          rustup toolchain install
          node .github/scripts/build-time-code.mjs
      - name: No secret of the benchmark outside its environment
        # This job names no environment, so a secret it sees is a repository's or an
        # organization's: both must live in the environment benchmark alone, for main alone.
        env:
          KEY_LEAKED: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HELD_OUT_LEAKED: ${{ secrets.MENTE_BENCH_HELDOUT_TOKEN != '' }}
        run: if [ "$KEY_LEAKED" != false ] || [ "$HELD_OUT_LEAKED" != false ]; then echo "::error::a secret of the benchmark is set outside the environment benchmark"; exit 1; fi
      - name: Build mn
        run: cargo build --locked --release --bin mn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mn
          path: target/release/mn
          if-no-files-found: error
          retention-days: 1

  bench:
    name: Agent benchmark
    needs: build
    runs-on: ubuntu-24.04
    # The API key and the held-out token live only in this environment, whose deployment branches
    # are main alone: no other ref, and no pull request, runs with them
    # (docs/design-review.md, trust-from-structure).
    environment: benchmark
    timeout-minutes: 360
    env:
      # Whether the secret exists, never the secret itself.
      HAS_HELD_OUT: ${{ secrets.MENTE_BENCH_HELDOUT_TOKEN != '' }}
      # Every agent build and agent program runs through this, with least privilege.
      SANDBOX: benchmark/harness/sandbox.sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Put the pinned Rust outside the home
        # So the sandbox, which gives the build HOME in its working directory, still finds the
        # toolchain through RUSTUP_HOME. The runner context is not available in a job-level env, so
        # this is set from a step, where $RUNNER_TEMP is.
        run: echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mn
          path: ${{ runner.temp }}/bin
      - name: Put mn outside the workspace, as an executable
        # The sandbox hides the workspace, where the held-out set is checked out, from agent code,
        # so mn runs from the runner's temp. An artifact keeps no mode.
        run: chmod +x "$RUNNER_TEMP/bin/mn"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Install the benchmark's Rust and Odin
        id: toolchains
        run: bash benchmark/harness/install-toolchains.sh "$RUNNER_TEMP/odin"
      - name: Prove the sandbox denies the key, the network and the held-out set, before measuring
        # On this runner, before the held-out set or the API key is anywhere near it: a failure
        # stops the run (benchmark/harness/sandbox-check.ts).
        env:
          ODIN: ${{ steps.toolchains.outputs.odin }}
        run: node --disallow-code-generation-from-strings benchmark/harness/sandbox-check.ts --odin "$ODIN" --sandbox "$SANDBOX" --out "$RUNNER_TEMP/sandbox-out"
      - name: Find the held-out commit corpus.lock names
        id: lock
        if: env.HAS_HELD_OUT == 'true'
        run: echo "commit=$(awk '$1 == "held-out" { print $3 }' benchmark/corpus.lock)" >> "$GITHUB_OUTPUT"
      - name: Check out the held-out set
        if: env.HAS_HELD_OUT == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Menteion/mente-bench-heldout
          ref: ${{ steps.lock.outputs.commit }}
          token: ${{ secrets.MENTE_BENCH_HELDOUT_TOKEN }}
          path: held-out-set
          persist-credentials: false
      - name: Check the held-out set against corpus.lock
        if: env.HAS_HELD_OUT == 'true'
        # The checker's messages could name held-out tasks, so only its verdict reaches the log.
        run: node --disallow-code-generation-from-strings benchmark/check.mjs --held-out held-out-set > /dev/null 2>&1 || { echo "the held-out set does not match corpus.lock"; exit 1; }
      - name: The broker, the one process that holds the API key
        # The key reaches the broker on its standard input and in no environment, under Node's
        # permission model: it can start no process, worker, addon or WASI, read only its own file and
        # its limits, and write no file, and it spends within the run's budget and the limits of
        # benchmark/harness/broker-limits.json. The step ends once the broker listens, and the shell
        # that held the key with it (benchmark/harness/broker.ts, benchmark/harness/permission.json;
        # docs/design-review.md, untrusted-test-isolation).
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUDGET: ${{ inputs.budget }}
        run: |
          mkdir -m 700 "$RUNNER_TEMP/broker"
          printf '%s\n' "$ANTHROPIC_API_KEY" | env -i PATH="$PATH" node --disallow-code-generation-from-strings --permission --allow-fs-read="$GITHUB_WORKSPACE/benchmark/harness/broker.ts" --allow-fs-read="$GITHUB_WORKSPACE/benchmark/harness/broker-limits.json" benchmark/harness/broker.ts --socket "$RUNNER_TEMP/broker/socket" --budget "$BUDGET" > "$RUNNER_TEMP/broker/log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/broker/pid"
          for _ in $(seq 100); do if [ -S "$RUNNER_TEMP/broker/socket" ]; then break; fi; sleep 0.1; done
          cat "$RUNNER_TEMP/broker/log"
          if [ ! -S "$RUNNER_TEMP/broker/socket" ]; then echo "::error::the broker did not start"; exit 1; fi
      - name: Run
        timeout-minutes: 340
        env:
          ODIN: ${{ steps.toolchains.outputs.odin }}
          BUDGET: ${{ inputs.budget }}
          MODELS: ${{ inputs.models }}
          LANGUAGES: ${{ inputs.languages }}
          MILESTONE: ${{ inputs.milestone }}
          RUNS: ${{ inputs.runs }}
          TASKS: ${{ inputs.tasks }}
        run: |
          held_out=()
          if [ "$HAS_HELD_OUT" = true ]; then held_out=(--held-out held-out-set); fi
          # The output lies outside the workspace, which the sandbox hides, since every build's
          # working directory is inside it.
          node --disallow-code-generation-from-strings benchmark/harness/bench.ts --budget "$BUDGET" --models "$MODELS" --languages "$LANGUAGES" \
            --milestone "$MILESTONE" --runs "$RUNS" --tasks "$TASKS" --mn "$RUNNER_TEMP/bin/mn" --odin "$ODIN" \
            --sandbox "$SANDBOX" "${held_out[@]}" --out "$RUNNER_TEMP/bench-out" --broker "$RUNNER_TEMP/broker/socket"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: agent-benchmark-${{ inputs.milestone }}
          path: |
            ${{ runner.temp }}/bench-out
            !${{ runner.temp }}/bench-out/held-out
      - name: Remove the held-out set from the runner
        if: always()
        run: rm -rf held-out-set "$RUNNER_TEMP/bench-out/held-out"
      - name: Stop the broker
        # Whatever came before; its log holds no key, which the broker takes out of every byte it writes.
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/broker/pid" ]; then kill "$(cat "$RUNNER_TEMP/broker/pid")" 2> /dev/null || true; fi
          if [ -f "$RUNNER_TEMP/broker/log" ]; then cat "$RUNNER_TEMP/broker/log"; fi
