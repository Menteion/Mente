# Generated programs and the conformance suite on the three execution paths (docs/design-brief.md,
# "The quality system": a generator of well-typed programs, three execution paths, soundness by
# execution; exit criteria 4 and 5). Each call runs on the reference interpreter, on MIR with
# every check, on MIR without the checks Tier 1 proved, and as native code, and all four must
# print the same: a difference where the reference interpreter traps and the MIR without proven
# checks does not is a wrong proof. The comparison is compiler/mente-cli/src/mir_run/differential.rs.
#
# A pull request runs a fixed range of seeds that fits a few minutes. A failure names its seed,
# which replays with
#   MENTE_GEN_FIRST_SEED=<seed> MENTE_GEN_PROGRAMS=1 cargo test --release -p mente-cli -- --ignored --nocapture generated_programs_run_alike
# These runs never belong on a laptop. The nightly and dispatched runs, with ranges of their own,
# are generated-nightly.yml, whose jobs are named apart: no run with chosen inputs can report a
# check of this job's name.
#
# A required check of `main`: it runs on every pull request and again in the merge queue, and its
# first step after the checkout ends the job at once when no path .github/instrument-paths.txt
# lists for it changed. A run that accepts fewer programs than its platform's floor has checked
# too little, and fails.
# Every action is pinned to a full commit SHA; Dependabot proposes updates.
name: Generated programs

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: generated-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Every program with a difference, with its text, not only the first few.
  MENTE_GEN_SHOW: "50"

jobs:
  paths:
    name: Generated programs (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native code runs each call in a process of its own and links an executable a program,
          # both slower on Windows, which therefore takes fewer programs.
          - name: x86-64 Linux
            os: ubuntu-24.04
            programs: 400
          - name: x86-64 Windows
            os: windows-2025
            programs: 150
          - name: AArch64 Linux
            os: ubuntu-24.04-arm
            programs: 400
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      MENTE_GEN_FIRST_SEED: "0"
      MENTE_GEN_PROGRAMS: ${{ matrix.programs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Whether this change touches what the instrument watches
        id: watch
        run: node .github/scripts/watch.mjs generated.yml
      - name: Install the toolchain rust-toolchain.toml pins
        if: steps.watch.outputs.run != 'false'
        run: |
          rustup toolchain install
          rustc --version
      - name: Build the comparison in release
        if: steps.watch.outputs.run != 'false'
        run: cargo test --release --locked -p mente-cli --no-run
      - name: Overflow checks in this job's release build
        if: steps.watch.outputs.run != 'false'
        run: bash .github/scripts/overflow-proof.sh
      - name: Generated programs on the three paths
        if: steps.watch.outputs.run != 'false'
        run: |
          echo "Seeds $MENTE_GEN_FIRST_SEED ..= $(( MENTE_GEN_FIRST_SEED + MENTE_GEN_PROGRAMS - 1 ))" | tee -a "$GITHUB_STEP_SUMMARY"
          cargo test --release --locked -p mente-cli -- --ignored --nocapture --exact \
            mir_run::differential::tests::generated_programs_run_alike_on_the_three_paths \
            2>&1 | tee "$RUNNER_TEMP/generated.txt"
          # The floor of work done: three in four of the programs asked for pass every check,
          # Tier 1 included, and so run on the three paths. About 88% did on 2026-11-12 (354 of
          # 400 on Linux, 133 of 150 on Windows); fewer means the generator, the checker or the
          # count went wrong, and the run compared too little to mean anything.
          floor=$(( MENTE_GEN_PROGRAMS * 3 / 4 ))
          accepted=$(sed -n -E 's/^[0-9]+ programs, ([0-9]+) pass every check.*/\1/p' "$RUNNER_TEMP/generated.txt")
          calls=$(sed -n -E 's/^([0-9]+) calls compared .*/\1/p' "$RUNNER_TEMP/generated.txt")
          echo "Programs that pass every check: ${accepted:-none}, floor $floor; calls compared: ${calls:-none}" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -z "$accepted" ] || [ -z "$calls" ] || [ "$accepted" -lt "$floor" ] || [ "$calls" -eq 0 ]; then
            echo "::error::${accepted:-no} programs passed every check and ${calls:-no} calls were compared, below the floor of $floor programs"
            exit 1
          fi
      - name: The conformance suite on the three paths
        # Its result stands on its own, whatever the generated programs found.
        if: ${{ !cancelled() && steps.watch.outputs.run != 'false' }}
        env:
          MENTE_GEN_CALLS: "64"
          MENTE_GEN_EXHAUSTIVE: "4096"
        run: |
          cargo test --release --locked -p mente-cli -- --ignored --nocapture --exact \
            mir_run::differential::tests::conformance_programs_run_alike_on_the_three_paths \
            2>&1 | tee "$RUNNER_TEMP/conformance.txt"
      - name: Summary
        if: always() && steps.watch.outputs.run != 'false'
        run: |
          for f in generated conformance; do
            [ -f "$RUNNER_TEMP/$f.txt" ] || continue
            {
              echo "## $f"
              echo '```text'
              grep -E '^(seeds|[0-9]+ programs|discarded|[0-9]+ calls|[0-9]+ obligations|[0-9]+ programs with|unfinished|in [0-9])' "$RUNNER_TEMP/$f.txt" || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
