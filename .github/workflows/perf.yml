# The tight-loop kernels of perf/ (perf/README.md): M1's performance baselines for Mente's native
# code, with hardware counters where the runner exposes them, and the gap to C, C++ and Rust
# ("Measurement protocols" in ROADMAP.md). The base branch's compiler and this change's build
# every kernel on one runner and are measured side by side, since only a comparison on one
# machine means anything on shared runners. Where the runner counts instructions (AArch64), a
# change that executes more than the base beyond the tolerance in perf/run.mjs fails, and so does
# a run that counted none; wall time, the only measure on x86-64, is reported and never fails a
# run. The gaps are reported, not enforced. Benchmarks run here, never on a laptop.
#
# A required check of `main` on both platforms, for the checksums every kernel must agree on and
# for the instruction gate: it runs on every pull request, in the merge queue and on `main`, and
# its first step after the checkout ends the job at once when no path
# .github/instrument-paths.txt lists for it changed.
name: Performance

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  kernels:
    name: Tight-loop kernels (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # The x86-64 runner's virtual machine exposes no performance counters (perf/README.md).
          - name: x86-64 Linux
            os: ubuntu-24.04
            counters: ""
          - name: AArch64 Linux
            os: ubuntu-24.04-arm
            counters: --require-instructions
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      # One target directory for both compilers, so the dependencies are built once.
      CARGO_TARGET_DIR: ${{ github.workspace }}/../target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Whether this change touches what the instrument watches
        id: watch
        run: node .github/scripts/watch.mjs perf.yml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.watch.outputs.run != 'false'
        with:
          node-version: 24
      - name: Install the toolchain rust-toolchain.toml pins
        if: steps.watch.outputs.run != 'false'
        run: rustup toolchain install
      - name: Install clang 18
        if: steps.watch.outputs.run != 'false'
        run: |
          command -v clang-18 >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q clang-18; }
          clang-18 --version | head -1
      - name: Install perf and let it count
        if: steps.watch.outputs.run != 'false'
        # Hardware counters are counted only where the platform exposes them; the measuring
        # script records what it got, and falls back to wall time alone without perf.
        continue-on-error: true
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q linux-tools-common "linux-tools-$(uname -r)" \
            || sudo apt-get install -y -q linux-tools-common linux-tools-generic
          sudo sysctl -w kernel.perf_event_paranoid=-1
          perf --version
          perf stat -e cycles,instructions,branches,branch-misses,cache-references,cache-misses -- true
      - name: Test the measuring script
        if: steps.watch.outputs.run != 'false'
        run: node --test perf/run.test.mjs
      - name: Build the base branch's compiler
        if: steps.watch.outputs.run != 'false'
        env:
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # The base each event names: a pull request's branch, a merge group's base commit, the
          # commit before a push; a dispatched run compares with the commit before its own.
          case "$GITHUB_EVENT_NAME" in
            pull_request) base="origin/$GITHUB_BASE_REF" ;;
            merge_group) base="$GROUP_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
            *) base="HEAD~1" ;;
          esac
          if [ -z "$base" ]; then echo "::error::the $GITHUB_EVENT_NAME event names no base"; exit 1; fi
          git worktree add ../base "$base"
          # A target directory of its own: in a shared one, cargo found the base's build, whose
          # sources the worktree had just written, newer than this change's checkout, and reused
          # it as this change's, so every comparison measured the base twice.
          (cd ../base && rustup toolchain install && CARGO_TARGET_DIR="$RUNNER_TEMP/target-base" cargo build --release --locked --bin mn 2>&1) \
            | tee "$RUNNER_TEMP/build-base.txt"
          cp "$RUNNER_TEMP/target-base/release/mn" "$RUNNER_TEMP/mn-base"
      - name: Build this change's compiler
        if: steps.watch.outputs.run != 'false'
        run: |
          cargo build --release --locked --bin mn 2>&1 | tee "$RUNNER_TEMP/build-change.txt"
          cp "$CARGO_TARGET_DIR/release/mn" "$RUNNER_TEMP/mn"
          # Each compiler is compiled here from its own tree, never taken from a build of the
          # other: cargo names the directory it compiles mente-cli from. A base measured twice
          # (commit "Build the base compiler apart from the change in the Performance job") now
          # fails here instead of passing the comparison.
          # CARGO_TERM_COLOR colours the log, so the codes go before the line is read.
          compiled() { sed 's/\x1b\[[0-9;]*m//g' "$1" | grep -F "Compiling mente-cli v" | grep -qF "($2/compiler/mente-cli)"; }
          base_dir=$(cd ../base && pwd)
          compiled "$RUNNER_TEMP/build-base.txt" "$base_dir" \
            || { echo "::error::the base's mn was not compiled from $base_dir"; exit 1; }
          compiled "$RUNNER_TEMP/build-change.txt" "$GITHUB_WORKSPACE" \
            || { echo "::error::this change's mn was not compiled from $GITHUB_WORKSPACE"; exit 1; }
          # Two trees still compile to one binary when the change leaves the compiler's code as
          # it was (tests, comments, documents); every kernel is then the same executable.
          if cmp -s "$RUNNER_TEMP/mn" "$RUNNER_TEMP/mn-base"; then
            echo "The base and this change build the same mn: the change leaves the compiler's code as it was." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Measure
        if: steps.watch.outputs.run != 'false'
        env:
          COUNTERS: ${{ matrix.counters }}
        run: |
          node perf/run.mjs --mn "$RUNNER_TEMP/mn" --base-mn "$RUNNER_TEMP/mn-base" --base-tree ../base $COUNTERS \
            --out "$RUNNER_TEMP/perf-results.json" --work "$RUNNER_TEMP/perf-work"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.watch.outputs.run != 'false'
        with:
          name: perf-results-${{ matrix.os }}
          path: ${{ runner.temp }}/perf-results.json
          if-no-files-found: ignore
