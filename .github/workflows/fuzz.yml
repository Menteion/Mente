# The compiler's own fuzzer, `mn fuzz` (compiler/mente-cli/src/fuzz.rs; docs/design-brief.md, M1's
# exit criterion 6, "fuzzing finds no crash"): mutants of the repository's .mn programs through
# every phase, each in a worker process on the 256 MiB stack `mn` runs its work on. Built in release
# with debug assertions, and with the overflow checks every release build has (Cargo.toml), so an
# arithmetic overflow panics as in a debug build.
# A pull request touching the compiler gets a two-minute smoke run with a fixed seed; the nightly
# and dispatched runs, longer and with seeds of their own, are fuzz-nightly.yml, whose job is named
# apart, so that no run with chosen inputs can report this job's check.
# Each failure, minimized, is uploaded as the artifact `fuzz-failures` and fails the job.
# Heavy runs belong here, never on a developer's machine.
#
# A required check of `main`: it runs on every pull request, and its first step after the checkout
# ends the job at once when no path .github/instrument-paths.txt lists for it changed, the seed
# corpus included. In the merge queue it does not run again, since it ran on the pull request's
# head.
name: Fuzz

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: "true"

jobs:
  fuzz:
    name: Fuzz
    runs-on: ubuntu-24.04
    # The fuzzing budget, then up to 90 s of minimizing for each new failure.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Whether this change touches what the instrument watches
        id: watch
        run: node .github/scripts/watch.mjs fuzz.yml
      - name: The toolchain rust-toolchain.toml pins, once nothing of the change can run where cargo builds
        if: steps.watch.outputs.run != 'false'
        # Before rustup or cargo reads anything of the workspace: rust-toolchain.toml names a release
        # alone and no cargo configuration file is there; then cargo reads the manifests and the
        # lock, and a package with code that runs at build time, or a crate not approved, fails the
        # job before anything is built (.github/scripts/build-time-code.mjs).
        run: |
          node .github/scripts/build-time-code.mjs --before-toolchain
          rustup toolchain install
          node .github/scripts/build-time-code.mjs
      - name: Build mn
        if: steps.watch.outputs.run != 'false'
        run: cargo build --locked --release --bin mn
      - name: Overflow checks in this job's release build
        if: steps.watch.outputs.run != 'false'
        run: bash .github/scripts/overflow-proof.sh
      - name: Fuzz
        if: steps.watch.outputs.run != 'false'
        run: |
          seed=1
          seconds=120
          status=0
          target/release/mn fuzz --seed "$seed" --seconds "$seconds" --jobs "$(nproc)" --out fuzz-out || status=$?
          {
            echo "## mn fuzz --seed $seed --seconds $seconds --jobs $(nproc)"
            echo '```text'
            cat fuzz-out/summary.txt 2>/dev/null || echo "no summary: mn fuzz exited with $status"
            echo '```'
            for about in fuzz-out/*.txt; do
              case "$about" in */summary.txt) continue ;; esac
              [ -f "$about" ] || continue
              echo "### ${about#fuzz-out/}"
              echo '```text'
              cat "$about"
              echo '--- minimized input (first 40 lines):'
              head -n 40 "${about%.txt}.mn"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
          # The floor of work done: a campaign that ran no case found nothing because it looked
          # at nothing.
          runs=$(sed -n -E 's/^runs: ([0-9]+)$/\1/p' fuzz-out/summary.txt 2>/dev/null || true)
          if [ "$status" -eq 0 ] && { [ -z "$runs" ] || [ "$runs" -eq 0 ]; }; then
            echo "::error::mn fuzz ran ${runs:-no} cases"
            exit 1
          fi
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.watch.outputs.run != 'false'
        with:
          name: fuzz-failures
          path: fuzz-out
          if-no-files-found: ignore
