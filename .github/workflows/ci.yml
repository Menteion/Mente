# The verification commands of CLAUDE.md, on every pull request and on main (ROADMAP.md, M0a).
# Every action is pinned to a full commit SHA; Dependabot proposes updates.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86-64 Linux
            os: ubuntu-24.04
          - name: x86-64 Windows
            os: windows-2025
          - name: AArch64 Linux
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
      - name: cargo test
        run: cargo test --locked
      - name: mn spec
        run: cargo run --locked --bin mn -- spec
      - name: mn test --mutate
        run: cargo run --locked --bin mn -- test --mutate
      - name: mn view --spec
        run: cargo run --locked --bin mn -- view --spec examples/02_mechanical_sympathy_simd.mn

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # spec-graph looks up in git history the commits the documents name.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run verify:docs
