# The verification commands of CLAUDE.md, on every pull request and on main (ROADMAP.md, M0a).
# Every action is pinned to a full commit SHA; Dependabot proposes updates.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86-64 Linux
            os: ubuntu-24.04
          - name: x86-64 Windows
            os: windows-2025
          - name: AArch64 Linux
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    env:
      # A warning fails the build (ROADMAP.md, M0a: Rust hygiene).
      RUSTFLAGS: -D warnings
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain rust-toolchain.toml pins
        run: |
          rustup toolchain install
          rustc --version
      - name: rustfmt
        if: matrix.os == 'ubuntu-24.04'
        run: cargo fmt --all --check
      - name: clippy
        if: matrix.os == 'ubuntu-24.04'
        run: cargo clippy --all-targets --workspace --locked -- -D warnings
      - name: cargo test
        run: cargo test --locked
      - name: mn spec
        run: cargo run --locked --bin mn -- spec
      - name: mn test --mutate
        run: cargo run --locked --bin mn -- test --mutate
      - name: mn view --spec
        run: cargo run --locked --bin mn -- view --spec examples/02_mechanical_sympathy_simd.mn

  coverage:
    # Reported, not required: line coverage of the workspace's tests, in the run summary and as lcov.
    name: Coverage
    runs-on: ubuntu-24.04
    env:
      CARGO_LLVM_COV_VERSION: "0.9.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain rust-toolchain.toml pins, with llvm-tools
        run: |
          rustup toolchain install
          rustup component add llvm-tools
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: cargo-llvm-cov-${{ runner.os }}-${{ env.CARGO_LLVM_COV_VERSION }}
      - name: Install cargo-llvm-cov
        run: command -v cargo-llvm-cov || cargo install cargo-llvm-cov --locked --version "$CARGO_LLVM_COV_VERSION"
      - name: Measure
        run: |
          cargo llvm-cov --workspace --locked --lcov --output-path lcov.info
          {
            echo '## Line coverage'
            echo '```text'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: lcov.info

  bench:
    # The projection protocol of ROADMAP.md, in release, on the base branch and then on this
    # change, on one runner: shared runners differ by up to a factor of two from run to run, so
    # only a comparison on one machine means anything. A median more than PROJECTION_TOLERANCE
    # above the base's fails the job. Not a required check.
    name: Projection benchmark
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup toolchain install
      - name: Measure the base branch
        run: |
          # A pull request compares with its base; a push to main, with the commit before it.
          if [ -n "$GITHUB_BASE_REF" ]; then base="origin/$GITHUB_BASE_REF"; else base="HEAD~1"; fi
          git worktree add ../base "$base"
          (cd ../base && cargo test --release --locked -p mente-cli -- --ignored --nocapture view_projection_protocol) \
            | sed -n -E 's/^([^ :]+): median ([0-9.]+) .*/\1 \2/p' > "$RUNNER_TEMP/base-medians.txt"
          cat "$RUNNER_TEMP/base-medians.txt"
      - name: Measure this change against it
        run: |
          export MENTE_BENCH_BASELINE="$RUNNER_TEMP/base-medians.txt" MENTE_BENCH_ENFORCE=1
          cargo test --release --locked -p mente-cli -- --ignored --nocapture view_projection_protocol

  tier1-latency:
    # The Tier-1 re-check protocol of ROADMAP.md, in release: 1,000 timed single-token edits to
    # the generated module and to each module in examples/, applied to the session
    # `mn check --watch` runs. A 99th percentile of 5 ms or more, in any module, fails the job.
    # Not a required check.
    name: Tier-1 latency
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup toolchain install
      - name: Measure
        run: MENTE_BENCH_ENFORCE=1 cargo test --release --locked -p mente-cli -- --ignored --nocapture tier1_recheck_protocol

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # spec-graph looks up in git history the commits the documents name.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run verify:docs
      - run: npm run check:benchmark
      - run: npm run test:benchmark
      - run: npm run test:harness
