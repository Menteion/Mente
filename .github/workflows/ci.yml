# The verification commands of CLAUDE.md, on every pull request, in the merge queue and on main
# (ROADMAP.md, M0a). Every job but Coverage is a required check of `main`
# (.github/required-checks.txt).
# Every action is pinned to a full commit SHA; Dependabot proposes updates.
name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86-64 Linux
            os: ubuntu-24.04
          - name: x86-64 Windows
            os: windows-2025
          - name: AArch64 Linux
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    # Four times the slowest run, 10 minutes with nextest still to build: a hang in a step outside
    # nextest's limits, the doctests or the gates by name, holds the runner no longer.
    timeout-minutes: 45
    env:
      # A warning fails the build (ROADMAP.md, M0a: Rust hygiene).
      RUSTFLAGS: -D warnings
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain rust-toolchain.toml pins
        run: |
          rustup toolchain install
          rustc --version
      - name: rustfmt
        if: matrix.os == 'ubuntu-24.04'
        run: cargo fmt --all --check
      - name: clippy
        if: matrix.os == 'ubuntu-24.04'
        run: cargo clippy --all-targets --workspace --locked -- -D warnings
      - name: Install cargo-nextest
        run: bash .github/scripts/install-nextest.sh
      - name: Record the tools, before any code of the change runs
        # Every step after it runs code of the change, which could replace a tool the next step
        # runs or set its path or environment; each checks the tools at its end
        # (.github/scripts/tools.sh).
        run: /usr/bin/bash .github/scripts/tools.sh record
      - name: The sandbox the code of the change runs in, proven before any of it runs
        # On Linux every test executable, and every binary `cargo run` starts, runs as a user of
        # its own in a root that holds the workspace read-only and none of the tools, with no
        # network and no sight of another process, so that it cannot fake the steps that judge it.
        # The canary tries each route as the runner's user, where it must be open, and in the
        # sandbox, where it must be closed (.github/scripts/test-sandbox.sh). Windows has no
        # sandbox yet (docs/design-review.md, untrusted-test-isolation).
        run: |
          /usr/bin/bash .github/scripts/test-sandbox.sh setup
          /usr/bin/bash .github/scripts/test-sandbox.sh check
          /usr/bin/bash .github/scripts/tools.sh verify
      - name: Build the tests
        run: |
          cargo test --locked --workspace --no-run
          /usr/bin/bash .github/scripts/tools.sh verify
      - name: The ignored tests and those given more time, as nextest lists them
        # On each runner: a test ignored in any spelling libtest reads, unless
        # .config/ignored-tests.txt lists it, or a test given a longer limit that is ignored or
        # compiled out here, fails the job (.github/scripts/test-list.mjs).
        run: |
          . .github/scripts/limits.sh
          cargo-nextest nextest list --locked --workspace --run-ignored all --message-format json > "$RUNNER_TEMP/tests.json"
          node .github/scripts/test-list.mjs nextest "$RUNNER_TEMP/tests.json"
          /usr/bin/bash .github/scripts/test-sandbox.sh ran
          /usr/bin/bash .github/scripts/tools.sh verify
      - name: Tests, through nextest under the ci profile's limits
        # Each test runs in a process of its own under the time limits of .config/nextest.toml: a
        # test past its time is stopped and fails, and so does one that leaves a process behind.
        # Every process runs under the memory limits of .github/scripts/limits.sh, which the
        # mutation runs share: a test that allocates without end fails instead of taking the
        # runner down. The tests were built above, outside the limits. nextest runs as its own
        # binary, which install-nextest.sh checked, not through cargo, where an alias could stand in.
        # On Linux each test runs in the sandbox, and the step fails if none did.
        run: |
          . .github/scripts/limits.sh
          cargo-nextest nextest run --locked --workspace --profile ci
          /usr/bin/bash .github/scripts/test-sandbox.sh ran
          /usr/bin/bash .github/scripts/tools.sh verify
      - name: No doctests
        # nextest runs no doctests, and `cargo test --doc` has no limit for one: rustdoc lists
        # every doc example it would compile, in any spelling of a doc comment or attribute, and
        # each library must list none (.github/scripts/test-list.mjs). Listing compiles nothing.
        run: |
          . .github/scripts/limits.sh
          cargo test --locked --workspace --doc -- --list > "$RUNNER_TEMP/doctests.txt" 2>&1
          node .github/scripts/test-list.mjs doctests "$RUNNER_TEMP/doctests.txt"
          /usr/bin/bash .github/scripts/tools.sh verify
      - name: The gate tests, by name
        # By name, so that a manifest that drops the target (autotests = false) fails here instead
        # of leaving the gates untested (compiler/mente-cli/tests/gates.rs).
        run: |
          . .github/scripts/limits.sh
          cargo test --locked -p mente-cli --test gates
          /usr/bin/bash .github/scripts/test-sandbox.sh ran
          /usr/bin/bash .github/scripts/tools.sh verify
      - name: mn spec
        run: |
          . .github/scripts/limits.sh
          cargo run --locked --bin mn -- spec
          /usr/bin/bash .github/scripts/test-sandbox.sh ran
          /usr/bin/bash .github/scripts/tools.sh verify
      - name: mn test --mutate
        run: |
          . .github/scripts/limits.sh
          cargo run --locked --bin mn -- test --mutate
          /usr/bin/bash .github/scripts/test-sandbox.sh ran
          /usr/bin/bash .github/scripts/tools.sh verify
      - name: mn view --spec
        run: |
          . .github/scripts/limits.sh
          cargo run --locked --bin mn -- view --spec examples/02_mechanical_sympathy_simd.mn
          /usr/bin/bash .github/scripts/test-sandbox.sh ran
          /usr/bin/bash .github/scripts/tools.sh verify

  coverage:
    # Reported, not required: line coverage of the workspace's tests, in the run summary and as lcov.
    name: Coverage
    runs-on: ubuntu-24.04
    env:
      CARGO_LLVM_COV_VERSION: "0.9.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain rust-toolchain.toml pins, with llvm-tools
        run: |
          rustup toolchain install
          rustup component add llvm-tools
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: cargo-llvm-cov-${{ runner.os }}-${{ env.CARGO_LLVM_COV_VERSION }}
      - name: Install cargo-llvm-cov
        run: command -v cargo-llvm-cov || cargo install cargo-llvm-cov --locked --version "$CARGO_LLVM_COV_VERSION"
      - name: Measure
        run: |
          cargo llvm-cov --workspace --locked --lcov --output-path lcov.info
          {
            echo '## Line coverage'
            echo '```text'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: lcov.info

  bench:
    # The projection protocol of ROADMAP.md, in release, on the base branch and then on this
    # change, on one runner: shared runners differ by up to a factor of two from run to run, so
    # only a comparison on one machine means anything. A median more than PROJECTION_TOLERANCE
    # above the base's fails the job.
    name: Projection benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup toolchain install
      - name: Overflow checks in this job's release build
        run: bash .github/scripts/overflow-proof.sh
      - name: Measure the base branch
        env:
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # The base each event names: a pull request's branch, a merge group's base commit, the
          # commit before a push; a dispatched run compares with the commit before its own.
          case "$GITHUB_EVENT_NAME" in
            pull_request) base="origin/$GITHUB_BASE_REF" ;;
            merge_group) base="$GROUP_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
            *) base="HEAD~1" ;;
          esac
          if [ -z "$base" ]; then echo "::error::the $GITHUB_EVENT_NAME event names no base"; exit 1; fi
          git worktree add ../base "$base"
          # The measurement's failure or its timeout fails the step, not only sed's.
          set -o pipefail
          (cd ../base && timeout 15m cargo test --release --locked -p mente-cli -- --ignored --nocapture view_projection_protocol) \
            | sed -n -E 's/^([^ :]+): median ([0-9.]+) .*/\1 \2/p' > "$RUNNER_TEMP/base-medians.txt"
          cat "$RUNNER_TEMP/base-medians.txt"
      - name: Measure this change against it
        run: |
          export MENTE_BENCH_BASELINE="$RUNNER_TEMP/base-medians.txt" MENTE_BENCH_ENFORCE=1
          timeout 15m cargo test --release --locked -p mente-cli -- --ignored --nocapture view_projection_protocol

  execution-paths:
    # The three execution paths, the reference interpreter, MIR and native code, on every probe
    # and preliminary program, over every example and hidden test of their tasks, on each
    # platform native code runs on: too slow for a debug build, so in release here; the unit
    # tests compare the examples and the construct programs alone.
    name: Execution paths (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86-64 Linux
            os: ubuntu-24.04
          - name: x86-64 Windows
            os: windows-2025
          - name: AArch64 Linux
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup toolchain install
      - name: Overflow checks in this job's release build
        run: bash .github/scripts/overflow-proof.sh
      - name: Compare
        # In bash on every runner: Windows' own shell finds its timeout.exe, which only waits.
        shell: bash
        run: timeout 15m cargo test --release --locked -p mente-cli -- --ignored matches_the_reference_interpreter

  debuggers:
    # Native code that `mn build` builds from a .mn program, stepped through by a scripted gdb
    # session on Linux and a cdb session on Windows (compiler/mente-cli/tests/debuggers).
    name: Debuggers (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86-64 Linux
            os: ubuntu-24.04
          - name: x86-64 Windows
            os: windows-2025
          - name: AArch64 Linux
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup toolchain install
      - name: Install gdb
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q gdb && gdb --version | head -1
      - name: Build mn
        run: cargo build --locked --bin mn
      - name: Step through
        run: bash compiler/mente-cli/tests/debuggers/check.sh target/debug/mn

  tier1-latency:
    # The Tier-1 re-check protocol of ROADMAP.md, in release: 1,000 timed single-token edits to
    # the generated module and to each module in examples/, applied to the session
    # `mn check --watch` runs. A 99th percentile of 5 ms or more, in any module, fails the job.
    name: Tier-1 latency
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup toolchain install
      - name: Measure
        run: MENTE_BENCH_ENFORCE=1 timeout 15m cargo test --release --locked -p mente-cli -- --ignored --nocapture tier1_recheck_protocol
      - name: Overflow checks in this job's release build
        run: bash .github/scripts/overflow-proof.sh

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # spec-graph looks up in git history the commits the documents name.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Exactly a name and a command, first, and through node itself: before npm ci, so that no
      # install script or npm hook can change what it runs. The Rust jobs' test
      # test_the_documentation_job_runs_the_workflow_policy fails on any other key or order.
      - name: The workflow policy, its required checks, path lists, pins and milestone tags
        run: node --test .github/scripts/policy.test.mjs .github/scripts/yaml.test.mjs
      - name: Every pinned action is the commit its release's tag names
        # The policy checks a pin's form; this asks each action's repository for the commit its
        # tag names (.github/scripts/action-pins.mjs).
        run: node .github/scripts/action-pins.mjs
      # No package's install script runs: none is needed, and one could write the environment of
      # the steps after it.
      - run: npm ci --ignore-scripts
      - run: npm run verify:docs
      - name: Install actionlint and shellcheck, pinned and checksummed
        # From their releases, as the SMT job installs Z3; neither is a build dependency.
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          SHELLCHECK_VERSION: "0.11.0"
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/lint"
          mkdir -p "$bin"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$bin" actionlint
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/shellcheck.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          install "$RUNNER_TEMP/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" "$bin/shellcheck"
          "$bin/actionlint" -version
          "$bin/shellcheck" --version
      - name: actionlint over every workflow, with shellcheck on every run script
        run: |
          "$RUNNER_TEMP/lint/actionlint" -color -shellcheck "$RUNNER_TEMP/lint/shellcheck" -pyflakes ""
      - run: npm run check:benchmark
      - run: npm run test:benchmark
      - run: npm run test:harness
