# The preliminary runs of the M1 tasks (docs/design-review.md, early-core-benchmark and
# benchmark-difficulty): agents write the public M1 solve tasks, the core ones, the others or those named,
# from the language card, with repairs, and the reference interpreter runs their examples and
# hidden tests. Run by hand, within the budget Norman set;
# the programs and the record are kept as an artifact, and the findings go to benchmark/prelim/.
#
# The repairs need the API key and the agents' programs in one job, so every program runs through
# the benchmark's sandbox (benchmark/harness/sandbox.sh), which denies it the key, the network and
# the workspace, and the job proves the sandbox with sandbox-check.ts before the key is in reach.
# Every action is pinned to a full commit SHA; Dependabot proposes updates.
name: Preliminary run

on:
  workflow_dispatch:
    inputs:
      tasks:
        description: Which public M1 solve tasks, core, non-core, or task ids separated by commas
        type: string
        default: core
      runs:
        description: Runs per task and model
        default: "5"
      budget:
        description: Budget in US dollars
        default: "5"

permissions:
  contents: read

concurrency:
  group: preliminary-run
  cancel-in-progress: false

jobs:
  build:
    # mn, built where no secret is: the build-time check first, as in every required job, so
    # that nothing of the branch runs where cargo builds; the job below, which holds the key, takes
    # the binary and builds nothing.
    name: Preliminary run, mn
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The toolchain rust-toolchain.toml pins, once nothing of the change can run where cargo builds
        # The step every required job but Commits, and every job that builds mn for one that holds
        # a secret, runs first, under one rule of the policy (TOOLCHAIN_STEP,
        # .github/scripts/build-time-code.mjs).
        run: |
          node .github/scripts/build-time-code.mjs --before-toolchain
          rustup toolchain install
          node .github/scripts/build-time-code.mjs
      - name: No secret of the benchmark outside its environment
        # This job names no environment, so a secret it sees is a repository's or an
        # organization's: both must live in the environment benchmark alone, for main alone.
        env:
          KEY_LEAKED: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HELD_OUT_LEAKED: ${{ secrets.MENTE_BENCH_HELDOUT_TOKEN != '' }}
        run: if [ "$KEY_LEAKED" != false ] || [ "$HELD_OUT_LEAKED" != false ]; then echo "::error::a secret of the benchmark is set outside the environment benchmark"; exit 1; fi
      - name: Build mn
        run: cargo build --locked --release --bin mn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mn
          path: target/release/mn
          if-no-files-found: error
          retention-days: 1

  prelim:
    name: Preliminary run
    needs: build
    runs-on: ubuntu-24.04
    # The API key and the held-out token live only in this environment, whose deployment branches
    # are main alone: no other ref, and no pull request, runs with them
    # (docs/design-review.md, trust-from-structure).
    environment: benchmark
    env:
      # Every agent program runs through this, with least privilege.
      SANDBOX: benchmark/harness/sandbox.sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Put the pinned Rust outside the home
        # So the sandbox, which gives a build HOME in its working directory, still finds the
        # toolchain through RUSTUP_HOME. The runner context is not available in a job-level env, so
        # this is set from a step, where $RUNNER_TEMP is.
        run: echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mn
          path: ${{ runner.temp }}/bin
      - name: Put mn outside the workspace, as an executable
        # The sandbox hides the workspace, so mn runs from the runner's temp. An artifact keeps no
        # mode.
        run: chmod +x "$RUNNER_TEMP/bin/mn"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Install the benchmark's Rust and Odin
        id: toolchains
        run: bash benchmark/harness/install-toolchains.sh "$RUNNER_TEMP/odin"
      - name: Take root from the runner's user, but for the sandbox
        # From here to the job's end sudo runs nothing for the runner's user but the sandbox's
        # root-owned half, no core dump is written, no process traces another, and no container
        # daemon listens, so that no process of that user reads the key out of another's memory
        # (benchmark/harness/lock-sudo.sh; docs/design-review.md, untrusted-test-isolation).
        run: bash benchmark/harness/lock-sudo.sh
      - name: Prove the sandbox denies the key, the network and the workspace, before any agent writes
        env:
          ODIN: ${{ steps.toolchains.outputs.odin }}
        run: node --disallow-code-generation-from-strings benchmark/harness/sandbox-check.ts --odin "$ODIN" --sandbox "$SANDBOX" --out "$RUNNER_TEMP/runs/sandbox-check"
      - name: The broker, the one process that holds the API key
        # The key reaches the broker on its standard input and in no environment. Under Node's
        # permission model and the flags of benchmark/harness/permission.json it can start no process,
        # worker, addon or WASI, read only its own file and its limits, and write none; it sends on only
        # the shape of request the harness makes, within the limits of broker-limits.json; and its
        # socket is the runner's user's alone, out of the sandbox's reach. The step ends once it
        # listens, and the shell that held the key with it, a shell that reads no BASH_ENV, ENV,
        # SHELLOPTS or BASHOPTS and names every command by its path (benchmark/harness/start-broker.sh;
        # docs/design-review.md, untrusted-test-isolation).
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUDGET: ${{ inputs.budget }}
        shell: /usr/bin/env -u BASH_ENV -u ENV -u SHELLOPTS -u BASHOPTS /usr/bin/bash --noprofile --norc -eo pipefail {0}
        run: /usr/bin/bash benchmark/harness/start-broker.sh
      - name: Run
        env:
          TASKS: ${{ inputs.tasks }}
          RUNS: ${{ inputs.runs }}
          BUDGET: ${{ inputs.budget }}
        run: >-
          node --disallow-code-generation-from-strings benchmark/harness/prelim.ts --sandbox "$SANDBOX" --mn "$RUNNER_TEMP/bin/mn"
          --tasks "$TASKS" --runs "$RUNS" --budget "$BUDGET" --out "$RUNNER_TEMP/runs/prelim" --broker "$RUNNER_TEMP/broker/socket"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: preliminary-run-${{ inputs.tasks }}
          path: ${{ runner.temp }}/runs/prelim
      - name: Stop the broker
        # Whatever came before; its log holds no key, which the broker takes out of every byte it
        # writes. Then root must still be out of the runner's user's reach, as the lock left it.
        if: always()
        run: |
          bash benchmark/harness/stop-broker.sh
          bash benchmark/harness/lock-sudo.sh --check
