# The preliminary runs of the M1 tasks (docs/design-review.md, early-core-benchmark and
# benchmark-difficulty): agents write the public M1 solve tasks, the core ones, the others or those named,
# from the language card, with repairs, and the reference interpreter runs their examples and
# hidden tests. Run by hand, within the budget Norman set;
# the programs and the record are kept as an artifact, and the findings go to benchmark/prelim/.
#
# The repairs need the API key and the agents' programs in one job, so every program runs through
# the benchmark's sandbox (benchmark/harness/sandbox.sh), which denies it the key, the network and
# the workspace, and the job proves the sandbox with sandbox-check.ts before the key is in reach.
# Every action is pinned to a full commit SHA; Dependabot proposes updates.
name: Preliminary run

on:
  workflow_dispatch:
    inputs:
      tasks:
        description: Which public M1 solve tasks, core, non-core, or task ids separated by commas
        type: string
        default: core
      runs:
        description: Runs per task and model
        default: "5"
      budget:
        description: Budget in US dollars
        default: "5"

permissions:
  contents: read

concurrency:
  group: preliminary-run
  cancel-in-progress: false

jobs:
  prelim:
    name: Preliminary run
    runs-on: ubuntu-24.04
    env:
      # Every agent program runs through this, with least privilege.
      SANDBOX: benchmark/harness/sandbox.sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Put the pinned Rust outside the home
        # So the sandbox, which gives a build HOME in its working directory, still finds the
        # toolchain through RUSTUP_HOME. The runner context is not available in a job-level env, so
        # this is set from a step, where $RUNNER_TEMP is.
        run: echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup toolchain install
      - name: Build mn and put it outside the workspace
        # The sandbox hides the workspace, so mn runs from the runner's temp.
        run: |
          cargo build --locked --release --bin mn
          install -D target/release/mn "$RUNNER_TEMP/bin/mn"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install the benchmark's Rust and Odin
        id: toolchains
        run: bash benchmark/harness/install-toolchains.sh "$RUNNER_TEMP/odin"
      - name: Prove the sandbox denies the key, the network and the workspace, before any agent writes
        env:
          ODIN: ${{ steps.toolchains.outputs.odin }}
        run: node benchmark/harness/sandbox-check.ts --odin "$ODIN" --sandbox "$SANDBOX" --out "$RUNNER_TEMP/sandbox-out"
      - name: Run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TASKS: ${{ inputs.tasks }}
          RUNS: ${{ inputs.runs }}
          BUDGET: ${{ inputs.budget }}
        run: >-
          node benchmark/harness/prelim.ts --sandbox "$SANDBOX" --mn "$RUNNER_TEMP/bin/mn"
          --tasks "$TASKS" --runs "$RUNS" --budget "$BUDGET" --out "$RUNNER_TEMP/prelim-out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: preliminary-run-${{ inputs.tasks }}
          path: ${{ runner.temp }}/prelim-out
