# The preliminary run of the core M1 tasks (docs/design-review.md, early-core-benchmark): agents
# write the public core M1 tasks from the language card, with repairs, and the reference
# interpreter runs their examples and hidden tests. Run by hand, within the budget Norman set;
# the programs and the record are kept as an artifact, and the findings go to benchmark/prelim/.
name: Preliminary run

on:
  workflow_dispatch:
    inputs:
      runs:
        description: Runs per task and model
        default: "5"
      budget:
        description: Budget in US dollars
        default: "5"

permissions:
  contents: read

concurrency:
  group: preliminary-run
  cancel-in-progress: false

jobs:
  prelim:
    name: Preliminary run
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup toolchain install
      - name: Build mn
        run: cargo build --locked --release --bin mn
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUNS: ${{ inputs.runs }}
          BUDGET: ${{ inputs.budget }}
        run: node benchmark/harness/prelim.ts --mn target/release/mn --runs "$RUNS" --budget "$BUDGET" --out prelim-out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: preliminary-run
          path: prelim-out
