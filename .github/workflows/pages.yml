# The documentation site (docs/design-review.md, `docs-site`): built with mdBook from the
# repository's own sources by site/build.mjs, its generator tested and every link of the built site
# checked. "Build the site" is a required check of `main`, so the workflow runs on every pull
# request, in the merge queue and on main, with no `paths:` filter, which would leave a skipped run
# unreported: the site reads the compiler for `mn explain`'s pages and the tests it cites, and its
# link check reads every file its pages link to, across the repository, so no list of paths is
# smaller than the build, which takes about a minute. Publishing at a milestone tag is
# pages-publish.yml, since a workflow that holds a required job runs only on pull requests, the
# queue and main. Every action is pinned to a full commit SHA, as in ci.yml.
name: Pages

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: The toolchain rust-toolchain.toml pins, once nothing of the change can run where cargo builds
        # Before rustup or cargo reads anything of the workspace: rust-toolchain.toml names a release
        # alone and no cargo configuration file is there; then cargo reads the manifests and the
        # lock, and a package with code that runs at build time, or a crate not approved, fails the
        # job before anything is built (.github/scripts/build-time-code.mjs).
        run: |
          node .github/scripts/build-time-code.mjs --before-toolchain
          rustup toolchain install
          node .github/scripts/build-time-code.mjs
      - name: Test the site generator and its link check
        run: |
          /usr/bin/bash .github/scripts/clean-tree.sh
          npm run test:site
          /usr/bin/bash .github/scripts/clean-tree.sh
      - name: Install mdBook
        # Downloaded and checked against its digest on every run: no cache, which another job of the
        # same pull request could have written (.github/scripts/install-mdbook.sh).
        run: bash .github/scripts/install-mdbook.sh
      - name: Build mn, whose `mn explain` the error-code pages come from
        run: |
          /usr/bin/bash .github/scripts/clean-tree.sh
          cargo build --locked --bin mn
          /usr/bin/bash .github/scripts/clean-tree.sh
      - name: Build the site and check every link
        env:
          # The commit the site is built from, which an unreleased build names.
          SITE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          /usr/bin/bash .github/scripts/clean-tree.sh
          node site/build.mjs --mn target/debug/mn --mdbook "$HOME/.local/mdbook/mdbook"
          /usr/bin/bash .github/scripts/clean-tree.sh
      - name: Keep the built site for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: target/site/book
          retention-days: 14
