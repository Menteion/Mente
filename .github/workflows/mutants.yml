# Mutation testing of the compiler with cargo-mutants, on GitHub's runners and never on a
# developer's machine (ROADMAP.md, M0a). A pull request mutates only the lines it changes;
# the full run is split across runners, weekly and on demand. Settings: .cargo/mutants.toml.
name: Mutants

on:
  pull_request:
    paths:
      - "compiler/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/mutants.toml"
      - ".github/workflows/mutants.yml"
  schedule:
    - cron: "0 18 * * 0" # Mondays, 02:00 in Taipei
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_MUTANTS_VERSION: "27.1.0"

jobs:
  in-diff:
    # Each mutant rebuilds and runs the whole workspace's tests, one after another, so a large
    # pull request takes hours on one runner; four shards share its mutants.
    name: Mutants in the diff (shard ${{ matrix.shard }} of 4)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-mutants
          key: cargo-mutants-${{ runner.os }}-${{ env.CARGO_MUTANTS_VERSION }}
      - name: Install cargo-mutants
        run: command -v cargo-mutants || cargo install cargo-mutants --locked --version "$CARGO_MUTANTS_VERSION"
      - name: Mutate the lines this pull request changes
        run: |
          git diff "origin/${GITHUB_BASE_REF}...HEAD" > pr.diff
          status=0
          cargo mutants --in-diff pr.diff --shard ${{ matrix.shard }}/4 --in-place --no-shuffle || status=$?
          # The outcome files decide, not the exit code: cargo-mutants exits 3 whenever a mutant
          # timed out, even when others were missed. A timeout made a loop never end, which any
          # test run would notice, so it counts as caught; a missed mutant fails the job.
          case "$status" in 0|2|3) ;; *) exit "$status" ;; esac
          if [ -s mutants.out/timeout.txt ]; then
            echo "Timed out, counted as caught: $(wc -l < mutants.out/timeout.txt)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -s mutants.out/missed.txt ]; then
            { echo "## Missed mutants"; echo "```text"; cat mutants.out/missed.txt; echo "```"; } >> "$GITHUB_STEP_SUMMARY"
            exit 2
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants-in-diff-${{ matrix.shard }}
          path: mutants.out
          if-no-files-found: ignore

  full:
    name: Full run (shard ${{ matrix.shard }} of 4)
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-mutants
          key: cargo-mutants-${{ runner.os }}-${{ env.CARGO_MUTANTS_VERSION }}
      - name: Install cargo-mutants
        run: command -v cargo-mutants || cargo install cargo-mutants --locked --version "$CARGO_MUTANTS_VERSION"
      - name: Mutate this shard of the compiler
        run: |
          status=0
          cargo mutants --shard ${{ matrix.shard }}/4 --in-place --no-shuffle || status=$?
          # The outcome files decide, not the exit code: cargo-mutants exits 3 whenever a mutant
          # timed out, even when others were missed. A timeout made a loop never end, which any
          # test run would notice, so it counts as caught; a missed mutant fails the job.
          case "$status" in 0|2|3) ;; *) exit "$status" ;; esac
          if [ -s mutants.out/timeout.txt ]; then
            echo "Timed out, counted as caught: $(wc -l < mutants.out/timeout.txt)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -s mutants.out/missed.txt ]; then
            { echo "## Missed mutants"; echo "```text"; cat mutants.out/missed.txt; echo "```"; } >> "$GITHUB_STEP_SUMMARY"
            exit 2
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: mutants.out
          if-no-files-found: ignore
