# Mutation testing of the compiler with cargo-mutants, on GitHub's runners and never on a
# developer's machine (ROADMAP.md, M0a). A pull request mutates only the lines it changes; the
# full run, weekly and on demand, is mutants-full.yml, whose jobs are named apart, so that no run
# with chosen inputs can report this job's check. Tests run through nextest. Settings:
# .cargo/mutants.toml and .config/nextest.toml.
#
# "Mutants in the diff" is a required check of `main`: it runs on every pull request, and its first
# step after the checkout ends the job at once when no path .github/instrument-paths.txt lists for
# it changed. In the merge queue it does not run again, since it ran on the pull request's head.
name: Mutants

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_MUTANTS_VERSION: "27.1.0"
  # The nextest profile that stops a test running too long (.config/nextest.toml).
  NEXTEST_PROFILE: mutants

jobs:
  in-diff:
    # Each mutant rebuilds and runs the whole workspace's tests, one after another, so a large
    # pull request takes hours on one runner; four shards share its mutants.
    name: Mutants in the diff (shard ${{ matrix.shard }} of 4)
    runs-on: ubuntu-24.04
    # The most GitHub allows a job: a shard of #120 took 154 minutes.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Whether this change touches what the instrument watches
        id: watch
        run: node .github/scripts/watch.mjs mutants.yml
      - name: Install the toolchain rust-toolchain.toml pins
        if: steps.watch.outputs.run != 'false'
        run: rustup toolchain install
      - name: Install cargo-mutants
        if: steps.watch.outputs.run != 'false'
        # Built from its crate, which cargo checks, never restored from a cache that another job of
        # the same pull request could have written.
        run: cargo install cargo-mutants --locked --version "$CARGO_MUTANTS_VERSION"
      - name: Install cargo-nextest
        if: steps.watch.outputs.run != 'false'
        run: bash .github/scripts/install-nextest.sh
      - name: Run the tests once without a mutant
        if: steps.watch.outputs.run != 'false'
        # cargo-mutants' own baseline tests only the packages it mutates, though every mutant
        # runs the whole workspace's tests, so the timeout it set from that baseline was often
        # its 20 s minimum, and cut a mutant's tests short before any had failed. This baseline
        # runs what every mutant runs, and cargo-mutants skips its own.
        run: |
          set -o pipefail
          cargo nextest run --workspace 2>&1 | tee baseline.log
          { echo "## Slowest tests without a mutant"; echo '```text'
            sed 's/\x1b\[[0-9;]*m//g' baseline.log | grep -E '^ +PASS \[' | sort -t'[' -k2 -rn | awk 'NR <= 10'
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Mutate the lines this pull request changes
        if: steps.watch.outputs.run != 'false'
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          git diff "origin/${GITHUB_BASE_REF}...HEAD" > pr.diff
          # The limits every test runs under, as in the required Rust jobs.
          . .github/scripts/limits.sh
          # Every count the floor reads must be a number: an empty one fails, never compares.
          count() { case "$1" in ''|*[!0-9]*) echo "::error::$2 is not a count: '$1'"; exit 1 ;; esac; }
          # The outcome files decide, not the exit code: cargo-mutants exits 2 when a mutant was
          # missed and 3 when one timed out. A mutant that loops without end fails the test
          # nextest stops, and so is caught; a mutant that still runs past the timeout, ten
          # minutes against the baseline's one or two, is not known to be caught, and fails the
          # job as a missed one does.
          status=0
          cargo mutants --in-diff pr.diff --shard "$SHARD/4" --in-place --no-shuffle --baseline=skip --timeout 600 || status=$?
          case "$status" in 0|2|3) ;; *) exit "$status" ;; esac
          # cargo-mutants' diff filter marks only the lines next to a deleted line; every mutant of
          # the function enclosing one runs too.
          cargo mutants --list --json > all-mutants.json
          cargo mutants --in-diff pr.diff --list --json > diff-mutants.json
          node .github/scripts/mutants-floor.mjs deleted pr.diff all-mutants.json diff-mutants.json > deleted-re.txt
          deleted=()
          while IFS= read -r re; do if [ -n "$re" ]; then deleted+=(--re "$re"); fi; done < deleted-re.txt
          if [ "${#deleted[@]}" -gt 0 ]; then
            status=0
            cargo mutants "${deleted[@]}" --shard "$SHARD/4" --in-place --no-shuffle --baseline=skip --timeout 600 --output deleted || status=$?
            case "$status" in 0|2|3) ;; *) exit "$status" ;; esac
          fi
          failed=0
          for out in mutants.out deleted/mutants.out; do
            for outcome in missed timeout; do
              if [ -s "$out/$outcome.txt" ]; then
                { echo "## Mutants $outcome"; echo '```text'; cat "$out/$outcome.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
                failed=2
              fi
            done
          done
          # The floor of work done. Every mutant cargo-mutants lists for this shard has an outcome;
          # and when the diff changes code where mutants lie, counted apart from cargo-mutants' own
          # diff filter and under the base's .cargo/mutants.toml, so that a pull request cannot
          # exclude what it changes (.github/scripts/mutants-floor.mjs), the run tested some. A
          # diff of tests, comments or files outside the compiler holds no such mutant: floor 0.
          tested=$(cat mutants.out/caught.txt mutants.out/missed.txt mutants.out/timeout.txt mutants.out/unviable.txt \
            deleted/mutants.out/caught.txt deleted/mutants.out/missed.txt deleted/mutants.out/timeout.txt \
            deleted/mutants.out/unviable.txt 2>/dev/null | grep -c . || true)
          count "$tested" "the mutants tested"
          cargo mutants --in-diff pr.diff --shard "$SHARD/4" --list --json > shard-mutants.json
          listed=$(node .github/scripts/mutants-floor.mjs count shard-mutants.json)
          count "$listed" "the mutants listed for this shard"
          if [ "${#deleted[@]}" -gt 0 ]; then
            cargo mutants "${deleted[@]}" --shard "$SHARD/4" --list --json > shard-deleted.json
            more=$(node .github/scripts/mutants-floor.mjs count shard-deleted.json)
            count "$more" "the mutants of deleting hunks listed for this shard"
            listed=$((listed + more))
          fi
          echo "Mutants listed for this shard: $listed; tested: $tested" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$tested" -ne "$listed" ]; then
            echo "::error::cargo-mutants listed $listed mutants for this shard and reported an outcome for $tested"
            failed=1
          fi
          if [ "$SHARD" = 0 ]; then
            if git show "origin/${GITHUB_BASE_REF}:.cargo/mutants.toml" > base-mutants.toml 2>/dev/null; then
              config=(--config base-mutants.toml)
            else
              config=(--no-config)
            fi
            cargo mutants --list --json "${config[@]}" > base-all-mutants.json
            expected=$(node .github/scripts/mutants-floor.mjs expected pr.diff base-all-mutants.json)
            count "$expected" "the mutants the diff changes"
            : > deleted-mutants.json
            if [ "${#deleted[@]}" -gt 0 ]; then cargo mutants "${deleted[@]}" --list --json > deleted-mutants.json; fi
            in_diff=$(node .github/scripts/mutants-floor.mjs count diff-mutants.json)
            count "$in_diff" "the mutants cargo-mutants lists for the diff"
            around=$(node .github/scripts/mutants-floor.mjs count deleted-mutants.json)
            count "$around" "the mutants around deleted lines"
            # Every mutant the base's settings expect must be in the run's lists, by name.
            node .github/scripts/mutants-floor.mjs missing pr.diff base-all-mutants.json diff-mutants.json deleted-mutants.json > missing.txt
            lost=$(grep -c . missing.txt || true)
            count "$lost" "the expected mutants the run leaves out"
            echo "Mutants the diff changes, under the base's settings: $expected; listed for the run: $((in_diff + around)); left out: $lost" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$lost" -gt 0 ]; then
              { echo "## Mutants the run leaves out"; echo '```text'; cat missing.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
              echo "::error::$lost of the $expected mutants the diff changes are not in the run's lists: an exclusion lands apart from the change to what it excludes"
              failed=1
            fi
          fi
          exit "$failed"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.watch.outputs.run != 'false'
        with:
          name: mutants-in-diff-${{ matrix.shard }}
          path: |
            mutants.out
            deleted/mutants.out
          if-no-files-found: ignore
