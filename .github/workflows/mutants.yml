# Mutation testing of the compiler with cargo-mutants, on GitHub's runners and never on a
# developer's machine (ROADMAP.md, M0a). A pull request mutates only the lines it changes;
# the full run is split across runners, weekly and on demand. Settings: .cargo/mutants.toml.
name: Mutants

on:
  pull_request:
    paths:
      - "compiler/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/mutants.toml"
      - ".github/workflows/mutants.yml"
  schedule:
    - cron: "0 18 * * 0" # Mondays, 02:00 in Taipei
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_MUTANTS_VERSION: "27.1.0"

jobs:
  in-diff:
    name: Mutants in the diff
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-mutants
          key: cargo-mutants-${{ runner.os }}-${{ env.CARGO_MUTANTS_VERSION }}
      - name: Install cargo-mutants
        run: command -v cargo-mutants || cargo install cargo-mutants --locked --version "$CARGO_MUTANTS_VERSION"
      - name: Mutate the lines this pull request changes
        run: |
          git diff "origin/${GITHUB_BASE_REF}...HEAD" > pr.diff
          status=0
          cargo mutants --in-diff pr.diff --in-place --no-shuffle || status=$?
          # Exit 3 means some mutants timed out: each made a loop never end, which any test run
          # would notice, so a timeout counts as caught. Exit 2, a mutant no test caught, still fails.
          if [ "$status" -eq 3 ]; then
            echo "Some mutants timed out; they count as caught." >> "$GITHUB_STEP_SUMMARY"
            status=0
          fi
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants-in-diff
          path: mutants.out
          if-no-files-found: ignore

  full:
    name: Full run (shard ${{ matrix.shard }} of 4)
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-mutants
          key: cargo-mutants-${{ runner.os }}-${{ env.CARGO_MUTANTS_VERSION }}
      - name: Install cargo-mutants
        run: command -v cargo-mutants || cargo install cargo-mutants --locked --version "$CARGO_MUTANTS_VERSION"
      - name: Mutate this shard of the compiler
        run: |
          status=0
          cargo mutants --shard ${{ matrix.shard }}/4 --in-place --no-shuffle || status=$?
          # Exit 3 means some mutants timed out: each made a loop never end, which any test run
          # would notice, so a timeout counts as caught. Exit 2, a mutant no test caught, still fails.
          if [ "$status" -eq 3 ]; then
            echo "Some mutants timed out; they count as caught." >> "$GITHUB_STEP_SUMMARY"
            status=0
          fi
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: mutants.out
          if-no-files-found: ignore
