# The nightly and dispatched runs of the generated programs and the conformance suite on the three
# execution paths: the comparison of generated.yml over a new range of seeds each night, or over the
# range a dispatch names. Its jobs are named apart from generated.yml's required checks, so that no
# run with chosen inputs can report a check of their names (.github/scripts/policy.test.mjs).
# Every run prints its range, and a failure names its seed, which replays with
#   MENTE_GEN_FIRST_SEED=<seed> MENTE_GEN_PROGRAMS=1 cargo test --release -p mente-cli -- --ignored --nocapture generated_programs_run_alike
# These runs never belong on a laptop.
# Every action is pinned to a full commit SHA; Dependabot proposes updates.
name: Generated programs, nightly

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
    inputs:
      first_seed:
        description: "First seed"
        required: true
        default: "0"
      programs:
        description: "Programs to generate on each platform"
        required: true
        default: "1000"

permissions:
  contents: read

concurrency:
  group: generated-nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Every program with a difference, with its text, not only the first few.
  MENTE_GEN_SHOW: "50"

jobs:
  paths:
    name: Generated programs, nightly (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native code runs each call in a process of its own and links an executable a program,
          # both slower on Windows, which therefore takes fewer programs.
          - name: x86-64 Linux
            os: ubuntu-24.04
            nightly_programs: 6000
            nightly_exhaustive: 65536
          - name: x86-64 Windows
            os: windows-2025
            nightly_programs: 1500
            nightly_exhaustive: 16384
          - name: AArch64 Linux
            os: ubuntu-24.04-arm
            nightly_programs: 6000
            nightly_exhaustive: 65536
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain rust-toolchain.toml pins
        run: |
          rustup toolchain install
          rustc --version
      - name: Choose the seeds
        env:
          EVENT: ${{ github.event_name }}
          INPUT_FIRST: ${{ inputs.first_seed }}
          INPUT_PROGRAMS: ${{ inputs.programs }}
          NIGHTLY_PROGRAMS: ${{ matrix.nightly_programs }}
          NIGHTLY_EXHAUSTIVE: ${{ matrix.nightly_exhaustive }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            first=$INPUT_FIRST
            programs=$INPUT_PROGRAMS
          else
            # A new range each day: the day's number since 1970 times the programs a night.
            day=$(( $(date -u +%s) / 86400 ))
            first=$(( day * NIGHTLY_PROGRAMS ))
            programs=$NIGHTLY_PROGRAMS
          fi
          case "$first$programs" in *[!0-9]*) echo "seeds must be numbers"; exit 1 ;; esac
          {
            echo "MENTE_GEN_FIRST_SEED=$first"
            echo "MENTE_GEN_PROGRAMS=$programs"
            echo "CONFORMANCE_EXHAUSTIVE=$NIGHTLY_EXHAUSTIVE"
            echo "MIN_ACCEPTED=$(( programs * 3 / 4 ))"
          } >> "$GITHUB_ENV"
          echo "Seeds $first ..= $(( first + programs - 1 ))" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build the comparison in release
        run: cargo test --release --locked -p mente-cli --no-run
      - name: Generated programs on the three paths
        run: |
          cargo test --release --locked -p mente-cli -- --ignored --nocapture --exact \
            mir_run::differential::tests::generated_programs_run_alike_on_the_three_paths \
            2>&1 | tee "$RUNNER_TEMP/generated.txt"
          accepted=$(sed -n -E 's/^[0-9]+ programs, ([0-9]+) pass every check.*/\1/p' "$RUNNER_TEMP/generated.txt")
          calls=$(sed -n -E 's/^([0-9]+) calls compared .*/\1/p' "$RUNNER_TEMP/generated.txt")
          echo "Programs that pass every check: ${accepted:-none}, floor $MIN_ACCEPTED; calls compared: ${calls:-none}" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -z "$accepted" ] || [ -z "$calls" ] || [ "$accepted" -lt "$MIN_ACCEPTED" ] || [ "$calls" -eq 0 ]; then
            echo "::error::${accepted:-no} programs passed every check and ${calls:-no} calls were compared, below the floor of $MIN_ACCEPTED programs"
            exit 1
          fi
      - name: The conformance suite on the three paths
        # Its result stands on its own, whatever the generated programs found.
        if: ${{ !cancelled() }}
        env:
          MENTE_GEN_CALLS: "64"
        run: |
          export MENTE_GEN_EXHAUSTIVE="$CONFORMANCE_EXHAUSTIVE"
          cargo test --release --locked -p mente-cli -- --ignored --nocapture --exact \
            mir_run::differential::tests::conformance_programs_run_alike_on_the_three_paths \
            2>&1 | tee "$RUNNER_TEMP/conformance.txt"
      - name: Summary
        if: always()
        run: |
          for f in generated conformance; do
            [ -f "$RUNNER_TEMP/$f.txt" ] || continue
            {
              echo "## $f"
              echo '```text'
              grep -E '^(seeds|[0-9]+ programs|discarded|[0-9]+ calls|[0-9]+ obligations|[0-9]+ programs with|unfinished|in [0-9])' "$RUNNER_TEMP/$f.txt" || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
