# Clippy settings for the workspace lints in Cargo.toml.
allow-unwrap-in-tests = true
allow-expect-in-tests = true

# Mente has no interior mutability: a value is changed only through `mut` (spec/mutable-value-semantics.md).
disallowed-types = [
  { path = "std::cell::Cell", reason = "Mente has no interior mutability; pass the value as mut" },
  { path = "std::cell::RefCell", reason = "Mente has no interior mutability; pass the value as mut" },
  { path = "std::cell::UnsafeCell", reason = "Mente has no interior mutability; pass the value as mut" },
]

# Threads start only in compiler/mente-threads, which fails a test that runs work on more than one
# thread at once beside others unless .config/nextest.toml puts it in the group that runs alone. The
# workspace forbids this lint (Cargo.toml), so no `allow` lowers it outside that crate.
disallowed-methods = [
  { path = "std::thread::available_parallelism", reason = "ask mente_threads::threads_for, which keeps a test that uses every core to the nextest group that runs alone" },
  { path = "std::thread::Scope::spawn", reason = "use mente_threads::concurrently or mente_threads::parallel, which keep a test that runs threads at once to the nextest group that runs alone" },
  { path = "std::thread::spawn", reason = "use mente_threads: alone for a thread the caller waits for, or a reader of a pipe" },
  { path = "std::thread::Builder::spawn", reason = "use mente_threads::alone, which waits for the thread" },
  { path = "std::thread::Builder::spawn_scoped", reason = "use mente_threads::alone, which waits for the thread" },
]
