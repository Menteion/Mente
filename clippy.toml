# Clippy settings for the workspace lints in Cargo.toml.
allow-unwrap-in-tests = true
allow-expect-in-tests = true

# Mente has no interior mutability: a value is changed only through `mut` (spec/mutable-value-semantics.md).
disallowed-types = [
  { path = "std::cell::Cell", reason = "Mente has no interior mutability; pass the value as mut" },
  { path = "std::cell::RefCell", reason = "Mente has no interior mutability; pass the value as mut" },
  { path = "std::cell::UnsafeCell", reason = "Mente has no interior mutability; pass the value as mut" },
]
