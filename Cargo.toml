[workspace]
resolver = "2"
members = [
    "compiler/mente-syntax",
    "compiler/mente-ast",
    "compiler/mente-sema",
    "compiler/mente-mir",
    "compiler/mente-codegen",
    "compiler/mente-cli",
    "compiler/mente-interp",
    "spikes/tier1-latency",
    "spikes/plant-macro",
]
# Workspaces of their own, with the external crates Norman approved for them (their README.md).
exclude = ["spikes/cranelift-debug-info", "spikes/error-return-registers"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0 WITH LLVM-exception"
repository = "https://github.com/Menteion/Mente"

# Lints every crate inherits with `[lints] workspace = true` (ROADMAP.md, M0a: Rust hygiene).
# They keep the compiler inside a subset of Rust that translates to Mente.
# An integer overflow inside the compiler traps in every build, release ones included: Tier 1's
# octagon once wrapped silently in a release build where a debug one panicked
# ([`guard-audit`](docs/design-review.md#guard-audit)). Safety comes before the compiler's speed.
[profile.release]
overflow-checks = true

[workspace.lints.rust]
# No runtime or FFI code exists yet, so no crate may use `unsafe`.
unsafe_code = "forbid"

[workspace.lints.clippy]
# Mente has no `.unwrap()`: outside tests, absence and failure are handled where they occur.
unwrap_used = "deny"
expect_used = "deny"
# No stand-ins (docs/design-brief.md, section 5).
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
